# FitLog iPhone avec Apple Santé : fabrique un IPA à installer soi-même (Sideloadly ou AltStore, Apple ID gratuit, 7 jours),
# pour tester la lecture d'Apple Santé avant de prendre le compte Apple Developer (TestFlight, App Store).
# Lancement : onglet Actions > "IPA Apple Santé (test)" > Run workflow. Le fichier arrive dans Releases > "FitLog iPhone (Apple Santé, test)".
# L'app affiche le site GitHub Pages (mises à jour sans refaire l'IPA) et ajoute le module natif Apple Santé (capacitor-health).
# Variable facultative APP_URL si ton site n'est pas à l'adresse par défaut.
name: IPA Apple Santé (test)
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/ios-sante.yml']
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    env:
      APP_URL: ${{ vars.APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choisir Xcode (le plus récent installé)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1); echo "Xcode : $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Préparer le projet Capacitor iOS
        run: |
          mkdir -p build/www && cd build
          echo '<!doctype html><meta charset="utf-8"><body style="background:#000">' > www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8 @capacitor/browser@8 @capacitor/filesystem@8 @capacitor/share@8 capacitor-health@8
          cat > capacitor.config.json <<JSON
          { "appId": "app.fitlog.perso", "appName": "FitLog", "webDir": "www",
            "server": { "url": "$APP_URL", "cleartext": false },
            "ios": { "contentInset": "never", "backgroundColor": "#000000" },
            "backgroundColor": "#000000" }
          JSON
          npx cap add ios
          npx cap sync ios
          ls ios/App
      - name: Apple Santé (droits et textes d'autorisation), retour depuis Strava, icône
        run: |
          python3 - <<'PY'
          import plistlib
          p='build/ios/App/App/Info.plist'
          d=plistlib.load(open(p,'rb'))
          d.setdefault('CFBundleURLTypes',[]).append({'CFBundleURLName':'app.fitlog.perso','CFBundleURLSchemes':['fitlog']})
          d['NSHealthShareUsageDescription']="FitLog lit tes séances de course enregistrées dans Apple Santé (distance, durée, fréquence cardiaque, tracé GPS) pour ton suivi, ton plan et tes records."
          d['NSHealthUpdateUsageDescription']="FitLog n'écrit rien dans Apple Santé ; cette autorisation est demandée par le module de lecture."
          d['ITSAppUsesNonExemptEncryption']=False
          plistlib.dump(d,open(p,'wb'))
          e={'com.apple.developer.healthkit':True,'com.apple.developer.healthkit.access':[]}
          plistlib.dump(e,open('build/ios/App/App/App.entitlements','wb'))
          PY
          sed -i '' 's/INFOPLIST_FILE = App\/Info.plist;/INFOPLIST_FILE = App\/Info.plist; CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' build/ios/App/App.xcodeproj/project.pbxproj
          grep -c CODE_SIGN_ENTITLEMENTS build/ios/App/App.xcodeproj/project.pbxproj
          cp icon-1024.png "build/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
      - name: Compiler (sans signature)
        run: |
          cd build/ios/App
          if [ -d App.xcworkspace ]; then P="-workspace App.xcworkspace"; else P="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $P -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}" build | tail -n 40
      - name: Emballer l'IPA (droit Apple Santé inclus pour Sideloadly / AltStore)
        run: |
          cd build/ios/App
          APP=dd/Build/Products/Release-iphoneos/App.app
          ls "$APP"
          # signature « ad hoc » : elle n'autorise rien, elle sert seulement à inscrire le droit Apple Santé dans l'app ;
          # Sideloadly ou AltStore re-signent ensuite avec ton Apple ID en gardant ce droit.
          if [ -d "$APP/Frameworks" ]; then for f in "$APP"/Frameworks/*; do codesign --force --sign - "$f"; done; fi
          codesign --force --sign - --entitlements App/App.entitlements "$APP"
          codesign -d --entitlements :- "$APP" | grep -A1 healthkit
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry ../../../FitLog-Sante.ipa Payload && ls -la ../../../FitLog-Sante.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FitLog-Sante
          path: FitLog-Sante.ipa
      - name: Publier dans Releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-sante --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-sante FitLog-Sante.ipa --title "FitLog iPhone (Apple Santé, test)" --notes "IPA à installer avec Sideloadly ou AltStore (Apple ID gratuit : 7 jours). Voir ios-sante.md." --prerelease
