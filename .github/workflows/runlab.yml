# Parcours (RunLab) : contrôle à chaque envoi qui touche runlab/ ou rl/.
# Lint, types, tests, puis vérifie que la version publiée (rl/) correspond bien au code (sinon : cd runlab && npm run build, puis committer rl/).
name: Parcours (RunLab)
on:
  push:
    branches: ['claude/**', main]
    paths: ['runlab/**', 'rl/**', '.github/workflows/runlab.yml']
  pull_request:
    paths: ['runlab/**', 'rl/**']
permissions:
  contents: read
jobs:
  runlab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runlab/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: rl/ à jour
        run: |
          npm run build
          git -C .. status --porcelain rl
          test -z "$(git -C .. status --porcelain rl)" || { echo "rl/ n'est pas à jour : lance « npm run build » dans runlab/ et committe rl/"; exit 1; }
