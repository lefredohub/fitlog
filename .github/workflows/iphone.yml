# Menhir : app iPhone (Capacitor + module Apple Santé « capacitor-health »).
# Mode test : l'app affiche le site GitHub Pages (mises à jour sans refaire l'app). Mode testflight : l'app est EMBARQUÉE (exigé pour l'App Store),
# sans Strava ; chaque nouvelle version passe par un nouvel envoi à TestFlight.
# Lancement : onglet Actions > "App iPhone" > Run workflow, puis choisir :
#   - test : projet Xcode prêt à ouvrir sur un Mac (compte Apple gratuit, 7 jours) + IPA, publiés dans Releases > "Menhir iPhone (test)" ;
#   - testflight : envoi à TestFlight (compte Apple Developer payant ; secrets APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, voir docs/iphone.md).
# Chaque modification de ce fichier sur une branche claude/** lance une compilation de contrôle (rien n'est publié).
# Variable facultative APP_URL si le site n'est pas à l'adresse par défaut.
name: App iPhone
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test (Xcode, compte gratuit) ou testflight (compte payant)'
        type: choice
        options: [test, testflight]
        default: test
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/iphone.yml']
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    env:
      APP_URL: ${{ vars.APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      MODE: ${{ inputs.mode || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choisir Xcode (le plus récent, hors bêta)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1); echo "Xcode : $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Préparer le projet Capacitor iOS
        run: |
          mkdir -p build/www && cd build
          if [ "$MODE" = testflight ]; then
            rsync -a --exclude build --exclude .git --exclude .github --exclude docs --exclude tests --exclude worker.js --exclude '*.md' --exclude 'strava-*' --exclude sw.js "$GITHUB_WORKSPACE/" www/
            SERVER=''
          else
            echo '<!doctype html><meta charset="utf-8"><body style="background:#000">' > www/index.html
            SERVER="\"server\": { \"url\": \"$APP_URL\", \"cleartext\": false },"
          fi
          npm init -y >/dev/null
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8 @capacitor/browser@8 @capacitor/filesystem@8 @capacitor/share@8 capacitor-health@8
          # identifiant gardé tel quel (app.fitlog.perso) : le changer crée une autre app, sans les données de l'actuelle. À décider au lancement App Store.
          cat > capacitor.config.json <<JSON
          { "appId": "app.fitlog.perso", "appName": "Menhir", "webDir": "www", $SERVER
            "ios": { "contentInset": "never", "backgroundColor": "#000000" },
            "backgroundColor": "#000000" }
          JSON
          npx cap add ios
          npx cap sync ios
      - name: Nom, Apple Santé (droits et textes d'autorisation), retour depuis Strava, icône
        run: |
          python3 - <<'PY'
          import plistlib
          p='build/ios/App/App/Info.plist'
          d=plistlib.load(open(p,'rb'))
          import os
          if os.environ.get('MODE')!='testflight': d.setdefault('CFBundleURLTypes',[]).append({'CFBundleURLName':'app.fitlog.perso','CFBundleURLSchemes':['fitlog']})
          d['CFBundleDisplayName']='Menhir'
          d['NSHealthShareUsageDescription']="Menhir lit tes séances de course enregistrées dans Apple Santé (distance, durée, fréquence cardiaque, tracé GPS) pour ton suivi, ton plan et tes records."
          d['NSHealthUpdateUsageDescription']="Menhir n'écrit rien dans Apple Santé ; cette autorisation est demandée par le module de lecture."
          d['ITSAppUsesNonExemptEncryption']=False
          plistlib.dump(d,open(p,'wb'))
          plistlib.dump({'com.apple.developer.healthkit':True,'com.apple.developer.healthkit.access':[]},open('build/ios/App/App/App.entitlements','wb'))
          PY
          sed -i '' 's/INFOPLIST_FILE = App\/Info.plist;/INFOPLIST_FILE = App\/Info.plist; CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' build/ios/App/App.xcodeproj/project.pbxproj
          grep -c CODE_SIGN_ENTITLEMENTS build/ios/App/App.xcodeproj/project.pbxproj
          cp icon-1024.png "build/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"

      # ---------- test : projet Xcode + IPA ----------
      - name: Projet Xcode prêt à ouvrir (Mac + compte Apple gratuit)
        if: env.MODE == 'test'
        run: |
          # dossier autonome : projet Xcode + modules (chemins relatifs), à dézipper n'importe où sur le Mac
          mv build Menhir-Xcode && ditto -c -k --keepParent Menhir-Xcode Menhir-Xcode.zip && ls -la Menhir-Xcode.zip
          # contrôle : le projet dézippé ailleurs se compile tel quel
          mkdir -p /tmp/essai && ditto -x -k Menhir-Xcode.zip /tmp/essai
          set -o pipefail
          xcodebuild -project /tmp/essai/Menhir-Xcode/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/essai/dd CODE_SIGNING_ALLOWED=NO build | tail -n 3
          mv Menhir-Xcode build
      - name: Compiler l'IPA (sans signature)
        if: env.MODE == 'test'
        run: |
          cd build/ios/App
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}" build | tail -n 20
          APP=dd/Build/Products/Release-iphoneos/App.app
          # signature « ad hoc » : elle inscrit seulement le droit Apple Santé ; Sideloadly ou AltStore re-signent ensuite avec l'Apple ID
          if [ -d "$APP/Frameworks" ]; then for f in "$APP"/Frameworks/*; do codesign --force --sign - "$f"; done; fi
          codesign --force --sign - --entitlements App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" | grep -A1 healthkit
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry ../../../Menhir.ipa Payload && ls -la ../../../Menhir.ipa
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'test'
        with:
          name: Menhir-iPhone
          path: |
            Menhir-Xcode.zip
            Menhir.ipa
      - name: Publier dans Releases
        if: env.MODE == 'test' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone-test --yes --cleanup-tag 2>/dev/null || true
          gh release create iphone-test Menhir-Xcode.zip Menhir.ipa --title "Menhir iPhone (test)" --prerelease \
            --notes "Avec un Mac : Menhir-Xcode.zip, à ouvrir dans Xcode (compte Apple gratuit, 7 jours). Menhir.ipa : pour Sideloadly, bloqué par Apple depuis fin octobre 2026. Voir docs/iphone.md."

      # ---------- testflight : compte Apple Developer payant ----------
      - name: Vérifier les secrets App Store Connect
        if: env.MODE == 'testflight'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KEY_ID ISSUER KEY_P8; do [ -n "${!v}" ] || { echo "Secret manquant : $v (voir docs/iphone.md)"; exit 1; }; done
          mkdir -p ~/.appstoreconnect/private_keys && printf '%s\n' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          cat > build/ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PL
      - name: Archiver et envoyer à TestFlight
        if: env.MODE == 'testflight'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd build/ios/App
          K="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/App.xcarchive" archive \
            -allowProvisioningUpdates -authenticationKeyPath "$K" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 30
          xcodebuild -exportArchive -archivePath "$PWD/App.xcarchive" -exportOptionsPlist ../../ExportOptions.plist -exportPath "$PWD/out" \
            -allowProvisioningUpdates -authenticationKeyPath "$K" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 30
