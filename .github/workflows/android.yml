# FitLog : fabrique l'APK Android (gratuit). Lancement manuel : onglet Actions > "APK Android" > Run workflow.
# L'APK est une coquille qui affiche ton site GitHub Pages : l'app se met à jour toute seule, sans refaire d'APK.
# Variable facultative APP_URL (Settings > Secrets and variables > Actions > Variables) si ton site n'est pas à l'adresse par défaut.
name: APK Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer le projet Capacitor
        run: |
          mkdir -p build/www && cd build
          echo '<!doctype html><meta charset="utf-8"><body style="background:#000">' > www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6 @capacitor/filesystem@6 @capacitor/share@6
          cat > capacitor.config.json <<JSON
          { "appId": "app.fitlog.perso", "appName": "FitLog", "webDir": "www",
            "server": { "url": "$APP_URL", "cleartext": false },
            "backgroundColor": "#000000" }
          JSON
          npx cap add android
          npx cap sync android
      - name: Retour depuis Strava (adresse fitlog://)
        run: |
          python3 - <<'PY'
          p='build/android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="fitlog" />
                  </intent-filter>
              '''
          assert '</activity>' in s
          s=s.replace('</activity>',f+'</activity>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -n 'fitlog' build/android/app/src/main/AndroidManifest.xml
      - name: Plein écran (barres noires, bouton Android masqué)
        run: |
          python3 - <<'PY'
          import glob,re
          # barres système noires, comme l'app
          p='build/android/app/src/main/res/values/styles.xml'
          s=open(p,encoding='utf-8').read()
          a='<item name="android:background">@null</item>'
          if a in s and 'navigationBarColor' not in s:
              s=s.replace(a,a+'\n        <item name="android:navigationBarColor">#000000</item>\n        <item name="android:statusBarColor">#000000</item>\n        <item name="android:windowBackground">#000000</item>',1)
              open(p,'w',encoding='utf-8').write(s)
          # barre de navigation masquée (réapparaît d'un glissement depuis le bas)
          f=glob.glob('build/android/app/src/main/java/**/MainActivity.java',recursive=True)[0]
          pk=re.search(r'^package\s+[^;]+;',open(f,encoding='utf-8').read(),re.M).group(0)
          open(f,'w',encoding='utf-8').write(pk+"""
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) { super.onCreate(b); immersive(); }
            @Override public void onWindowFocusChanged(boolean focus) { super.onWindowFocusChanged(focus); if (focus) immersive(); }
            private void immersive() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.navigationBars());
            }
          }
          """)
          PY
      - name: Icône de l'application
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          cd build/android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            convert "$GITHUB_WORKSPACE/icon-512.png" -resize ${s}x${s} mipmap-$n/ic_launcher.png
            convert "$GITHUB_WORKSPACE/icon-512.png" -resize ${s}x${s} mipmap-$n/ic_launcher_round.png
            convert "$GITHUB_WORKSPACE/icon-512.png" -resize $((f*62/100))x$((f*62/100)) -background none -gravity center -extent ${f}x${f} mipmap-$n/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#0A0908</color></resources>\n' > values/ic_launcher_background.xml
      - name: Construire l'APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          cd build/android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FitLog.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: FitLog Android
          body: Télécharge FitLog.apk sur ton téléphone Android et ouvre-le pour l'installer.
          files: FitLog.apk
