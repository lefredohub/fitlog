<style>
:root{--bg:#000;--s1:#101113;--s2:#1a1b1e;--s3:#26282c;--ln:rgba(255,255,255,.07);--tx:#f4f4f5;--mut:#8b8d93;--y:#ffd60a;--ok:#34c759;--rd:#ff5d52;box-sizing:border-box;color-scheme:dark}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 28% at 50% -8%,rgba(255,214,10,.08),transparent 70%)}
main{position:relative;padding:calc(env(safe-area-inset-top) + 10px) 20px calc(var(--nh,90px) + 28px);max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 22px}
h1{font:700 32px/1.05 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-1px;margin:0}
h2{font-size:17px;font-weight:650;letter-spacing:-.3px;margin:0 0 2px}
.logo{width:38px;height:38px;border-radius:10px;flex:none}.logo.lg{width:104px;height:104px;border-radius:24px;margin-bottom:18px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>span.n{width:26px;height:26px;border-radius:50%;background:var(--s2);color:var(--mut);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}
input,select{background:var(--s2);color:var(--tx);border:1px solid transparent;border-radius:12px;padding:12px 8px;font-size:18px;font-weight:600;width:100%;min-width:0;text-align:center;text-align-last:center;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:rgba(255,214,10,.7)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{background:var(--s2);color:var(--tx);border:0;border-radius:14px;padding:13px 16px;font:600 15px -apple-system,system-ui,sans-serif;transition:transform .12s,opacity .12s}
button:active{transform:scale(.97);opacity:.8}

button.sm{padding:9px 16px;font-size:14px;border-radius:12px}
button.more{background:none;color:var(--mut);padding:6px 8px;font-size:20px;line-height:1;letter-spacing:1px;border-radius:10px}
button.more.plus{font-size:30px;font-weight:300;color:var(--tx);letter-spacing:0;padding:2px 10px}

.bar{display:flex;gap:8px;margin-top:10px}.bar button{flex:1}

nav button.on{color:var(--y)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;background:var(--s2);color:#c4c5cb;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;margin:0 4px 4px 0}

.pr{border:1px solid rgba(255,214,10,.4);color:var(--y);border-radius:8px;padding:1px 6px;font-size:11px;font-weight:600}
.big{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.5px;white-space:nowrap;flex:none}
.empty{color:var(--mut);text-align:center;padding:40px 10px 28px}
.sec{font-size:13px;font-weight:600;color:var(--mut);margin:24px 4px 10px}
button.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:14px 16px;margin-bottom:10px;font-weight:400}
.item>div:not(.ico){flex:1;min-width:0}.item b{display:block;font-size:16px;font-weight:650;letter-spacing:-.2px}.item .sub{margin:2px 0 0}
.ico{width:42px;height:42px;border-radius:13px;background:var(--s2);color:var(--y);display:grid;place-items:center;flex:none}

.chev{width:18px;height:18px;color:var(--mut);flex:none;transition:transform .2s}
.hero{background:var(--s1);border:1px solid var(--ln);border-radius:26px;padding:22px;margin-bottom:12px}

.hero .sub{margin:0}.hero button{width:100%;margin-top:18px;padding:16px;font-size:17px}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;background:none;border-radius:9px;padding:9px;font-size:14px;color:var(--mut)}.seg button.on{background:var(--s3);color:var(--tx)}
.acc{background:var(--s1);border:1px solid var(--ln);border-radius:20px;margin-bottom:10px;overflow:hidden}
.acc>button{display:flex;align-items:center;gap:10px;width:100%;background:none;border-radius:0;padding:15px 16px;text-align:left;font-weight:600;font-size:16px}
.acc>button>span{flex:1}.acc small{color:var(--mut);font-weight:400;font-size:13px}.acc.open .chev{transform:rotate(90deg)}
.acc .body{padding:0 16px 16px}.acc .card{background:none;border:0;padding:0;margin:0}.acc .card>h2{display:none}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s both}
.sh-box{position:relative;width:100%;max-width:560px;background:var(--s2);border-radius:24px 24px 0 0;padding:8px 20px calc(14px + env(safe-area-inset-bottom));animation:up .25s ease both}
.sh-box .grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 6px}
.sh-box button{display:block;width:100%;text-align:left;background:none;border-radius:0;border-bottom:1px solid var(--ln);padding:16px 2px;font-size:17px;font-weight:500}
.sh-box button.d{color:var(--rd)}.sh-box button:last-child{border:0}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.fx>*{animation:in .3s ease both}
.toast{position:fixed;left:50%;bottom:calc(var(--nh,90px) + 14px);transform:translateX(-50%);max-width:88%;text-align:center;background:var(--s3);padding:11px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:60;animation:in .2s ease both}
.ov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}
@media(prefers-reduced-motion:reduce){button{transition:none}.fx>*,.toast,.sh-box,.sh-bg{animation:none}}
.hstats{display:flex;gap:30px;margin:14px 0 4px}.hstats .sub{margin:6px 0 0}
.hv{font-size:36px;font-weight:700;letter-spacing:-1.2px;line-height:1}.hv small{font-size:16px;color:var(--mut);font-weight:500;letter-spacing:0}
.hero{padding:14px 18px;border-radius:22px;margin-bottom:10px}.hero h2{font-size:22px;margin:2px 0}.hero .hstats{gap:24px;margin:8px 0 2px}.hero .hv{font-size:28px}.hero .hstats .sub{margin:4px 0 0}.hero .prog{margin:8px 0 6px}.hero button{margin-top:10px;padding:12px;font-size:15px}
.prog{height:4px;border-radius:2px;background:var(--s3);margin:18px 0 8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y);border-radius:2px}
.prow{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.prow .pill{margin:2px 0 0;min-width:58px;text-align:center}
button.pbody{flex:1;min-width:0;display:block;background:none;text-align:left;padding:0;border-radius:8px;font-weight:400;font-size:16px}
.pbody b{display:block;font-weight:650;letter-spacing:-.2px}.pbody .sub{display:block;margin:2px 0 0}
button.sb{background:none;padding:2px;color:var(--mut);flex:none;border-radius:50%}
.sb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}.sb.ok{color:var(--ok)}.sb.ko{color:var(--rd)}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{position:fixed;inset:0;width:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:28px}
nav{position:relative;flex:none;left:auto;right:auto;bottom:auto;background:#000;padding:2px 12px calc(env(safe-area-inset-bottom)*.35)}
nav button{padding:7px 0 4px}
</style></head><body><main id="app"></main>
<nav><button data-a="nav" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Accueil</button><button data-a="nav" data-v="run"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/></svg>Course</button><button data-a="nav" data-v="train"><svg viewBox="0 0 24 24"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>Renfo</button><button data-a="nav" data-v="hist"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg>Historique</button></nav>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('fitlog'))}catch(e){}
S=S||{t:[],h:[],a:null};
let pt=0,stT='';
const save=()=>{S._mod=Date.now();localStorage.setItem('fitlog',JSON.stringify(S));if(CFG()||AU()){clearTimeout(pt);pt=setTimeout(()=>{pt=0;pushAll()},5000)}};
const CFG=()=>{try{const c=JSON.parse(localStorage.getItem('fitlog-sync'));return c&&c.repo&&c.token?c:null}catch(e){return null}};
const setSt=t=>{stT=t;const e=$('#st');if(e)e.textContent=t};
const b64=t=>btoa(unescape(encodeURIComponent(t)));
const API=c=>`https://api.github.com/repos/${c.repo}/contents/fitlog.json`;
const HD=(c,a='application/vnd.github+json')=>({Authorization:'Bearer '+c.token,Accept:a});
async function push(){const c=CFG();if(!c)return;
  try{let sha;const g=await fetch(API(c),{headers:HD(c)});
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status);
    const r=await fetch(API(c),{method:'PUT',headers:HD(c),body:JSON.stringify({message:'sauvegarde '+new Date().toISOString(),content:b64(JSON.stringify(S)),sha})});
    if(!r.ok)throw new Error(r.status);
    setSt('Dernière sauvegarde : '+new Date().toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))
  }catch(e){setSt('Échec de la sauvegarde ('+e.message+')')}}
async function pull(){const c=CFG();if(!c){setSt('Renseigne le dépôt et le jeton.');return}
  try{const r=await fetch(API(c),{headers:HD(c,'application/vnd.github.raw+json')});if(!r.ok)throw new Error(r.status);
    const d=JSON.parse(await r.text());if(!confirm('Remplacer les données de ce téléphone par la sauvegarde ?'))return;
    S=d;localStorage.setItem('fitlog',JSON.stringify(S));setSt('Données restaurées.')
  }catch(e){setSt('Échec de la restauration ('+e.message+')')}}
function syncCard(){const c=CFG()||JSON.parse(localStorage.getItem('fitlog-sync')||'{}');
  return`<div class=card><h2>Sauvegarde GitHub (facultative)</h2><div class=sub id=st>${esc(stT||(CFG()?'Active : sauvegarde après chaque modification.':'Non configurée.'))}</div><label>Dépôt GitHub privé</label><input style="text-align:left" data-s=repo placeholder="pseudo/fitlog-data" autocapitalize=none autocorrect=off value="${esc(c.repo||'')}"><label>Jeton d'accès</label><input type=password style="text-align:left" data-s=token placeholder="github_pat_…" autocapitalize=none value="${esc(c.token||'')}"><div class=bar><button data-a=pushnow>Sauvegarder</button><button data-a=pull>Restaurer</button></div></div>`}
let lv='',view='home',ed=null,tm=null;
const LOGO=(c='logo')=>`<img class="${c}" src="icon-180.png" alt="">`;
const mv=i=>`<button data-a=mv data-i=${i} data-d=-1 style="padding:8px 11px;font-size:14px">↑</button><button data-a=mv data-i=${i} data-d=1 style="padding:8px 11px;font-size:14px">↓</button>`;
const pv=n=>{const l=last(n);return l?`Dernière fois (${new Date(l.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}) : ${fmt(l)}`:''};
const hint=e=>(e.prev?`<div class=sub style="margin-top:-4px">${esc(e.prev)}</div>`:'')+(e.pn?`<div class=sub style="margin-top:-4px">Note précédente : ${esc(e.pn)}</div>`:'');
const noteField=(i,e)=>`<input style="text-align:left;font-size:15px;margin-top:6px" placeholder="Note (réglage, sensation…)" data-k="${i}.note" value="${esc(e.note||'')}">`;
const exNames=()=>[...new Set([...S.t.flatMap(t=>t.ex.map(e=>e.name)),...S.h.flatMap(h=>h.ex.map(e=>e.name))])].filter(Boolean);
const METH={double:'Double progression',linear:'Surcharge linéaire',volume:'Progression en volume'};

function last(name){for(let i=S.h.length-1;i>=0;i--){const e=S.h[i].ex.find(x=>x.name===name);if(e&&e.sets.some(s=>s.done))return{...e,date:S.h[i].date}}return null}

// Calcule la cible de la prochaine séance pour un exo du modèle
function target(x){
  let w=+x.w||0,r=+x.min||1,n=+x.sets||3;const l=last(x.name);
  if(!l)return{w,r,n};
  const ds=l.sets.filter(s=>s.done),lw=+ds[0].w||w,ln=l.sets.length;
  const minR=Math.min(...ds.map(s=>+s.r||0)),rpe=Math.max(...ds.map(s=>+s.rpe||0)),inc=+x.inc||0;
  w=lw;n=ln;r=+x.min;
  if(x.m==='double'){
    if(minR>=+x.max&&rpe<=9){w=lw+inc;r=+x.min;n=+x.sets}
    else r=Math.min(+x.max,Math.max(+x.min,minR+1));
  }else if(x.m==='linear'){
    if(minR>=r&&ds.length>=ln)w=lw+inc;
  }else if(minR>=r){
    if(ln<5)n=ln+1;else{w=lw+inc;n=+x.sets}
  }
  return{w,r,n};
}
function start(id){
  const t=S.t.find(t=>t.id===id);
  S.a={id:uid(),name:t.name,date:new Date().toISOString(),ex:t.ex.map(x=>{
    if(x.t==='cardio'){const l=last(x.name),p=l&&l.sets.find(s=>s.done),d=p?p.d:x.min,v=p?p.l:(x.lvl||'');
      return{name:x.name,t:'cardio',m:x.m,rest:'',note:'',prev:pv(x.name),pn:(l&&l.note)||'',tg:`Cible : ${d} min${v?', niveau '+v:''}`,sets:[{d,l:v,done:true}]}}
    const g=target(x);
    return{name:x.name,m:x.m,rest:'',note:'',prev:pv(x.name),pn:(last(x.name)||{}).note||'',tg:`Cible : ${g.n}×${g.r}${x.m==='double'&&g.r<+x.max?'–'+x.max:''} à ${g.w} kg`,
      sets:Array.from({length:g.n},()=>({w:g.w,r:g.r,rpe:'',done:true}))}})};
  save();render();
}
function fmt(e){if(e.skip)return'Pas fait';if(e.t==='cardio')return e.sets.filter(s=>s.done).map(s=>`${s.d} min${s.l?' · niveau '+s.l:''}`).join(', ')||'—';return e.sets.filter(s=>s.done).map(s=>`${s.r}×${s.w}kg`).join(', ')||'—'}

function render(){
  if(S.plan)reconcilePlan();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='coach'?'run':view)));
  $('#app').innerHTML=(ed?editor():ge&&view==='goal'?goalView():sx&&view==='sedit'?sedit():view==='coach'?coachView():view==='set'?settings():view==='run'?runs():view==='hist'?history():view==='train'?(S.a?session():train()):dash())+`<datalist id=exn>${exNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
  if(view!==lv){lv=view;const m=$('#app');m.classList.remove('fx');void m.offsetWidth;m.classList.add('fx');m.scrollTop=0}
  if(view==='coach'){const m=$('#app');m.scrollTop=m.scrollHeight}
  if(S.a&&!ed)keep();
}



const SC=()=>{try{const c=JSON.parse(localStorage.getItem('fitlog-strava'));return c&&c.url&&c.key?c:null}catch(e){return null}};
let stS='';const setSv=t=>{stS=t;const e=$('#sv');if(e)e.textContent=t};
async function syncRuns(auto){const c=SC();if(!c){if(!auto)setSv("Renseigne l'adresse du Worker et la clé.");return}
  try{setSv('Synchronisation…');S.runs=S.runs||[];
    const last=S.runs.reduce((m,r)=>Math.max(m,new Date(r.d).getTime()),0);
    const after=last?Math.floor(last/1000)-86400:Math.floor(Date.now()/1000)-365*86400;
    const r=await fetch(c.url.replace(/\/$/,'')+'/activities?after='+after,{headers:{Authorization:'Bearer '+c.key}});
    if(r.status===409){setSv('Strava pas encore connecté : touche « Connecter Strava ».');return}
    if(!r.ok)throw new Error(r.status);
    const a=await r.json();a.forEach(x=>{const i=S.runs.findIndex(y=>y.id===x.id);i<0?S.runs.push(x):S.runs[i]=x});
    S.syncAt=Date.now();save();setSv(a.length+' sortie(s) récupérée(s)');if(view==='run'&&!ed)render()

function genPlan(g){
  const D=864e5,t0=wk(Date.now()),race=new Date(g.date+'T12:00:00').getTime(),n=Math.round((wk(race)-t0)/(7*D))+1;
  if(!(n>=1))return null;
  const P=g.time/g.dist,pe=pf(P*1.23),pt=pf(P*.98),pn=pf(P*.94),po=pf(P);
  const days=[...g.days].sort((a,b)=>a-b),r=days.length,L0=days.includes(+g.long)?+g.long:days[r-1];
  const peak=g.dist<=5.5?32:g.dist<=10.5?40:g.dist<=22?48:62,cap=g.dist>=40?32:g.dist>=20?24:g.dist>=10?18:14;
  const tw=g.dist>=40?3:g.dist>=20?2:1,b=Math.max(0,n-1-tw);
  const sp=n>=8?Math.max(2,Math.round(b*.3)):0,dv=n>=6?Math.round(b*.35):0,bs=Math.max(0,b-sp-dv);
  const dd=d=>{const x=Math.abs(d-L0);return Math.min(x,7-x)},today=(new Date().getDay()+6)%7,rd=(new Date(race).getDay()+6)%7;
  let v=+g.base||15;const weeks=[];
  for(let i=0;i<n;i++){
    const Lw=n-1-i,w=sd(t0,7*i).getTime();let ph,vol,pj=0,s=[];
    if(Lw===0){ph='Course';vol=.3*v+g.dist}
    else if(Lw<=tw){ph='Affûtage';vol=v*({1:[.6],2:[.75,.55],3:[.8,.65,.5]}[tw][tw-Lw])}
    else{ph=i<bs?'Base':i<bs+dv?'Développement':'Spécifique';pj=i-(ph==='Base'?0:ph==='Développement'?bs:bs+dv);
      if((i+1)%4===0)vol=v*.78;else{v=Math.min(peak,v*1.08);vol=v}}
    if(ph==='Course'){
      const pre=days.filter(d=>d<rd).slice(-2),k=Math.max(3,Math.round((vol-g.dist)/Math.max(1,pre.length)));
      s=pre.map(d=>({d,t:'Endurance',km:k,z:'ef',ld:1}));
      s.push({d:rd,t:'Course',km:g.dist,txt:`${g.name||'Course'} : objectif ${hms(g.time)} (${po}/km)`});
    }else{
      const lg=Math.min(cap,Math.max(5,Math.round(vol*(r<3?.45:.36)))),oth=days.filter(d=>d!==L0).sort((a,b)=>dd(b)-dd(a)||a-b);
      const q1=ph==='Développement'?'Fractionné':ph==='Spécifique'?'Allure objectif':'Tempo';
      const q2=r>=5?(ph==='Développement'?'Tempo':ph==='Spécifique'?'Fractionné':null):null;
      const sh=oth.length?Math.max(3,Math.round((vol-lg)/oth.length)):0,T=Math.min(30,15+5*pj),R=Math.min(10,5+pj),B=Math.min(40,15+5*pj);
      s=oth.map((d,j)=>{const t=j===0?q1:(j===1&&q2)?q2:'Endurance';return t==='Tempo'?{d,t,km:sh,z:'tp',m:ph==='Affûtage'?15:T}:t==='Fractionné'?{d,t,km:sh,z:'iv',r:R}:t==='Allure objectif'?{d,t,km:sh,z:'ob',m:B}:{d,t,km:sh,z:'ef'}});
      s.push({d:L0,t:'Sortie longue',km:lg,z:'ef',x:ph==='Spécifique'&&g.dist>=10?Math.round(lg*.3):0});
    }
    if(ph!=='Course')(g.races||[]).forEach(m=>{const md=new Date(m.d+'T12:00:00');if(wk(md)===w){const d=(md.getDay()+6)%7;s=s.filter(x=>x.d!==d);const qi=s.findIndex(x=>QT.includes(x.t));if(qi>=0)s.splice(qi,1);s.push({d,t:'Course',km:m.km,txt:m.n+' (course jalon)'})}});
    if(i===0)s=s.filter(x=>x.d>=today);
    s.sort((a,b)=>a.d-b.d);weeks.push({w,ph,s});
  }
  return weeks;
}

function history(){
  const best={},ser={},pr={},e1={};
  S.h.forEach((h,hi)=>h.ex.forEach((e,ei)=>{const ok=e.sets.filter(s=>s.done&&+s.w>0);if(!ok.length)return;
    const m=Math.max(...ok.map(s=>+s.w));(ser[e.name]=ser[e.name]||[]).push(m);
    if(e.name in best&&m>best[e.name])pr[hi+'.'+ei]=1;if(!(e.name in best)||m>best[e.name])best[e.name]=m;
    e1[e.name]=Math.max(e1[e.name]||0,...ok.map(s=>s.w*(1+s.r/30)))}));
  const seg=`<div class=seg><button class="${histTab==='s'?'on':''}" data-a=htab data-v=s>Séances</button><button class="${histTab==='r'?'on':''}" data-a=htab data-v=r>Records</button></div>`,top=`<div class=top><h1>Historique</h1></div>${seg}`;
  if(histTab==='r'){const rc=Object.entries(best);
    return top+(rc.length?`<div class=card>${rc.map(([n,w])=>`<div class=row style="justify-content:space-between;margin:12px 0"><div style="min-width:0"><div>${esc(n)} <button class=more data-a=rn data-n="${esc(n)}" style="font-size:13px;padding:2px 6px">✎</button></div><div class=sub style="margin:0">1RM estimé ≈ ${Math.round(e1[n])} kg</div></div>${spark(ser[n])}<span class=big>${w} kg</span></div>`).join('')}</div>`:'<div class=empty>Termine une séance pour voir tes records.</div>')}
  if(!S.h.length)return top+'<div class=empty>Aucune séance pour le moment.</div>';
  return top+S.h.map((h,hi)=>[h,hi]).reverse().map(([h,hi])=>{
    const vol=h.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.r||0)*(+s.w||0),0),0),n=h.ex.filter(e=>!e.skip).length,o=hOpen===hi;
    return`<button class=item data-a=hopen data-i=${hi} style="${o?'margin-bottom:0;border-radius:20px 20px 0 0':''}"><div><b>${esc(h.name)}</b><div class=sub>${new Date(h.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})} · ${n} exo${n>1?'s':''}${h.dur?' · '+h.dur+' min':''}${vol?' · '+Math.round(vol).toLocaleString('fr-FR')+' kg':''}</div></div><svg class=chev style="${o?'transform:rotate(90deg)':''}" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>`
    +(o?`<div class=card style="border-radius:0 0 20px 20px;border-top:0">${h.ex.map((e,ei)=>`<div style="margin:6px 0"><b>${esc(e.name)}</b>${pr[hi+'.'+ei]?' <span class=pr>record</span>':''}<div class=sub style="margin:0">${fmt(e)}${e.rest?' · repos '+e.rest+' s':''}</div>${e.note?`<div class=sub style="margin:0">${esc(e.note)}</div>`:''}</div>`).join('')}<button class=gh data-a=editlog data-i=${hi} style="padding-left:0">Modifier cette séance</button></div>`:'')}).join('')}



function runs(){
  const R=(S.runs||[]).slice().sort((a,b)=>b.d.localeCompare(a.d));
  const seg=`<div class=seg><button class="${runTab==='p'?'on':''}" data-a=rtab data-v=p>Plan</button><button class="${runTab==='r'?'on':''}" data-a=rtab data-v=r>Sorties</button></div>`,head=`<div class=top><h1>Course</h1></div>${seg}`;
  if(runTab==='p')return head+coachItem()+planBlock();
  const now=wk(Date.now()),W=[];for(let i=7;i>=0;i--){const x=new Date(now);x.setDate(x.getDate()-7*i);W.push(x.getTime())}
  const km=W.map(w=>R.filter(r=>wk(r.d)===w).reduce((a,r)=>a+r.km,0)),mx=Math.max(...km,1);
  const chart=`<svg viewBox="0 0 320 110" width="100%">${km.map((v,i)=>{const h=v/mx*68;return`<rect x="${i*40+8}" y="${86-h}" width="24" height="${Math.max(h,2)}" rx="6" fill="${i===7?'#ffd60a':'#26282c'}"/><text x="${i*40+20}" y="${82-h}" text-anchor="middle" font-size="11" fill="#c4c5cb">${v?Math.round(v):''}</text><text x="${i*40+20}" y="104" text-anchor="middle" font-size="10" fill="#8b8d93">${new Date(W[i]).toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'})}</text>`}).join('')}</svg>`;
  return head+(SC()?'':STRAVA_CTA)+(R.length?`<div class=card><h2>Kilomètres par semaine</h2><div class=sub>Cette semaine : ${km[7].toFixed(1)} km</div>${chart}</div>`
    +R.slice(0,runAll?40:5).map(r=>`<div class=card style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div style="min-width:0"><h2>${esc(r.n)}</h2><div class=sub style="margin:0">${new Date(r.d.slice(0,10)+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})} · ${hms(r.s)} · ${pace(r)} /km${r.up?' · D+ '+r.up+' m':''}${r.hr?' · '+r.hr+' bpm':''}</div></div><div class=big>${r.km.toFixed(1)}<span class=sub style="margin:0"> km</span></div></div>`).join('')
    +(R.length>5?`<button class=gh style="width:100%" data-a=rall>${runAll?'Réduire':'Tout afficher'}</button>`:''):`<div class=empty>Aucune sortie pour l'instant.</div>`)}

function acc(k,t,sub,body){const o=accOpen[k];return`<div class="acc${o?' open':''}"><button data-a=acc data-k=${k}><span>${t}${sub?`<br><small>${sub}</small>`:''}</span>${CH}</button>${o?`<div class=body>${body}</div>`:''}</div>`}
function settings(){const a=AU();

const SI={todo:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>',ok:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>',ko:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'};
const TP={Endurance:{z:'ef'},'Sortie longue':{z:'ef',x:0},Tempo:{z:'tp',m:20},'Fractionné':{z:'iv',r:6},'Allure objectif':{z:'ob',m:20},Course:{},Libre:{}};
const rdate=r=>new Date(r.d.slice(0,10)+'T12:00:00'),rday=r=>(rdate(r).getDay()+6)%7;
function matchWeek(W){
  const R=(S.runs||[]).filter(r=>wk(rdate(r))===W.w),used=new Set(),res=W.s.map(()=>null);
  W.s.forEach((s,i)=>{const c=R.filter(r=>!used.has(r.id)&&rday(r)===s.d).sort((a,b)=>b.km-a.km)[0];if(c){res[i]=c;used.add(c.id)}});
  W.s.forEach((s,i)=>{if(res[i]||s.st)return;const c=R.filter(r=>!used.has(r.id)&&rday(r)>s.d&&r.km>=.5*s.km).sort((a,b)=>rday(a)-rday(b))[0];if(c){res[i]=c;used.add(c.id)}});
  return res}
const sStatus=(W,s,run,today)=>s.st==='ok'?'ok':s.st==='ko'?'ko':run?'ok':iso(sd(W.w,s.d))<today?'ko':'todo';
function reconcilePlan(){const p=S.plan,today=iso(new Date());if(!p||p.rec===today)return;p.rec=today;
  const W=p.weeks.find(x=>x.w===wk(Date.now()));
  if(W){const td=(new Date().getDay()+6)%7,res=matchWeek(W),ran=(S.runs||[]).some(r=>r.d.slice(0,10)===today);
    const miss=W.s.map((s,i)=>({s,i})).filter(({s,i})=>s.d<td&&!s.st&&!res[i]&&!s.mv&&s.t!=='Course');
    if(miss.length&&!ran&&!W.s.some(s=>s.d===td)){
      const pr=t=>t==='Sortie longue'?3:QT.includes(t)?2:1;
      miss.sort((a,b)=>pr(b.s.t)-pr(a.s.t)||b.s.d-a.s.d);
      const c=miss.find(({s})=>!(QT.includes(s.t)&&W.s.some(x=>x.d===td+1&&x.t==='Sortie longue')));
      if(c){c.s.d=td;c.s.mv=1;W.s.sort((a,b)=>a.d-b.d)}}}
  save()}
function nextRun(){if(!S.plan)return null;const tk=iso(new Date());
  for(const W of S.plan.weeks){const res=matchWeek(W);for(let i=0;i<W.s.length;i++){const s=W.s[i],k=iso(sd(W.w,s.d));if(k<tk||sStatus(W,s,res[i],tk)==='ok')continue;return{W,s,i,k}}}return null}
const zoneTxt=(s,g)=>{const Z=zones();return['ef','tp','iv'].includes(s.z)?[`${Z[s.z][0]}–${Z[s.z][1]} bpm`,'FC cible']:s.t==='Course'?[hms(g.time),'objectif']:s.z==='ob'?[pf(g.time/g.dist)+'/km','allure cible']:['','']};

function dash(){
  const now=new Date(),R=S.runs||[],tk=iso(now),tm1=iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)),g=S.goal;
  let d=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});d=d[0].toUpperCase()+d.slice(1);
  const nr=nextRun();let hero;
  if(nr){const{W,s,k}=nr,when=k===tk?"Aujourd'hui":k===tm1?'Demain':DF[s.d]+' '+sd(W.w,s.d).getDate(),[zv,zl]=zoneTxt(s,g);
    const W0=S.plan.weeks.find(x=>x.w===wk(Date.now())),r0=W0?matchWeek(W0):[],tot=W0?W0.s.reduce((a,x)=>a+x.km,0):0,dn=W0?W0.s.reduce((a,x,i)=>a+(r0[i]?r0[i].km:(x.st==='ok'?x.km:0)),0):0;
    hero=`<div class=hero><div class=k>${when}</div><h2>${s.t}</h2><div class=hstats><div><div class=hv>${s.km}<small> km</small></div><div class=sub>distance</div></div>${zv?`<div><div class=hv style="font-size:20px;padding-top:5px">${zv}</div><div class=sub>${zl}</div></div>`:''}</div>${tot?`<div class=prog><i style="width:${Math.min(100,Math.round(dn/tot*100))}%"></i></div><div class=sub style="margin:0">${Math.round(dn)} / ${Math.round(tot)} km cette semaine</div>`:''}<button class=p data-a=nav data-v=run>Voir le plan</button></div>`}
  else hero=`<div class=hero><div class=k>Course</div><h2>Fixe ton objectif</h2><div class=sub>Ton plan d'entraînement se construit automatiquement.</div><button class=p data-a=nav data-v=run>Définir mon objectif</button></div>`;
  let ren='';
  if(S.a)ren=`<div class=card style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div class=sub style="margin:0">Renfo en cours</div><h2>${esc(S.a.name)}</h2></div><button class="p sm" data-a=nav data-v=train>Reprendre</button></div>`;
  else if(S.t.length){const c=S.t.map(t=>({t,d:lastDone(t)})).sort((a,b)=>a.d-b.d)[0];
    ren=`<div class=card style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div class=sub style="margin:0">Renfo · ${c.d?ago(c.d).toLowerCase():'pas encore fait'}</div><h2>${esc(c.t.name)}</h2></div><button class="p sm" data-a=start data-id=${c.t.id}>Démarrer</button></div>`}
  const w=wk(Date.now()),e=w+7*864e5,rr=R.filter(r=>wk(rdate(r))===w),km=rr.reduce((a,r)=>a+r.km,0),ms=S.h.filter(h=>{const t=new Date(h.date).getTime();return t>=w&&t<e}),
    mins=Math.round(rr.reduce((a,r)=>a+r.s,0)/60+ms.reduce((a,h)=>a+(h.dur||0),0));
  const wl=[km?km.toFixed(1).replace('.',',')+' km':'',ms.length?ms.length+' séance'+(ms.length>1?'s':'')+' de renfo':'',mins?Math.floor(mins/60)+'h'+String(mins%60).padStart(2,'0'):''].filter(Boolean).join(' · ');
  const lh=S.h.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0],lr=R.slice().sort((a,b)=>b.d.localeCompare(a.d))[0];let last='';
  if(lr)last+=item('run','r',esc(lr.n),`${ago(lr.d.slice(0,10)+'T12:00:00')} · ${lr.km.toFixed(1)} km · ${pace(lr)} /km`);
  if(lh){const vol=lh.ex.reduce((a,x)=>a+x.sets.reduce((b,s)=>b+(+s.r||0)*(+s.w||0),0),0),n=lh.ex.filter(x=>!x.skip).length;
    last+=item('hist','m',esc(lh.name),`${ago(lh.date)} · ${n} exo${n>1?'s':''}${lh.dur?' · '+lh.dur+' min':''}${vol?' · '+Math.round(vol).toLocaleString('fr-FR')+' kg':''}`)}
  return`<div class=top><div><div class=sub style="margin:0 0 2px">${d}</div><h1>Aujourd'hui</h1></div><button class=more data-a=nav data-v=set aria-label="Réglages">${GEAR}</button></div>${installCard()}${backupHint()}${S.a?ren:''}${hero}${S.a?'':ren}`
    +(last?`<div class=sec>Dernières activités</div>${last}`:'')+(wl?`<div class=sub style="margin:20px 4px 0">Cette semaine : ${wl}</div>`:'')}

function planBlock(){
  const g=S.goal,p=S.plan;
  if(!g||!p)return`<div class=card><h2>Objectif de course</h2><div class=sub>Définis ta course cible : l'app construit ton plan semaine par semaine.</div><button class=p style="width:100%" data-a=goal>Définir un objectif</button></div>`;
  const left=Math.ceil((new Date(g.date+'T12:00:00')-Date.now())/864e5),now=wk(Date.now()),today=iso(new Date());
  const card=W=>{const cur=W.w===now,res=matchWeek(W),tot=W.s.reduce((a,s)=>a+s.km,0),dn=W.s.reduce((a,s,i)=>a+(res[i]?res[i].km:(s.st==='ok'?s.km:0)),0);
    return`<div class=card><div class=row style="justify-content:space-between;margin:0 0 4px;align-items:flex-start"><div><h2>${cur?'Cette semaine':'Semaine du '+sd(W.w,0).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</h2><div class=sub style="margin:0">${W.ph} · ${cur?Math.round(dn)+' / ':''}${Math.round(tot)} km</div></div>${MORE('wk','data-w='+W.w)}</div>`
    +(W.s.map((s,i)=>{const dt=sd(W.w,s.d),run=res[i],st=sStatus(W,s,run,today);let title=`${s.t} · ${s.km} km`,sub;
      if(run&&s.st!=='ko'){title=`${s.t} · ${run.km.toFixed(1)} km`;const rn=rday(run);sub=`Fait${rn!==s.d?' '+DN[rn].toLowerCase()+'.':''} · ${pace(run)} /km${run.hr?' · '+run.hr+' bpm':''}`}

// ===== Coach IA =====
const COACH_SYS=`Tu es le coach de course à pied de l'utilisateur dans l'app FitLog. Sa priorité : l'objectif de course (voir CONTEXTE). Données en JSON : plan à venir par date (j = jour, st = fait/manqué/à faire), sorties récentes, renfo récent, zones FC en bpm, mémoire.
Réponds UNIQUEMENT par un objet JSON : {"reply":"...","changes":[...],"mem":"..."}
- reply : français, tutoiement, 70 mots max, direct, appuyé sur les données.
- changes (max 8, [] si simple question ou rien à changer) : {"op":"set","date":"AAAA-MM-JJ","t":"Endurance|Sortie longue|Tempo|Fractionné|Allure objectif|Libre","km":nombre,"txt":"détail court facultatif"} crée ou remplace la séance de ce jour ; {"op":"del","date":"AAAA-MM-JJ"} la supprime. Uniquement des dates d'aujourd'hui ou futures, jamais la séance « Course ». N'invente aucune donnée absente du contexte.
- mem : mémoire à jour (blessure, disponibilités, préférences durables ; 200 caractères max), ou null si inchangée.
Principes : environ 80 % du volume en endurance facile ; hausse hebdo ≤ 10 % ; semaine allégée toutes les 4 semaines ; pas de séance de qualité la veille d'une grosse séance de jambes ; affûtage avant la course. Douleur ou blessure : prudence, réduis, conseille un avis médical si elle persiste. Si la demande est floue, pose une seule question sans proposer de changement.`;
const CT=['Endurance','Sortie longue','Tempo','Fractionné','Allure objectif','Libre'];
let cv={busy:0,draft:''};
const planAt=d=>{const dt=new Date(d+'T12:00:00');if(isNaN(dt)||!S.plan)return null;const W=S.plan.weeks.find(x=>x.w===wk(dt));if(!W)return null;const dn=(dt.getDay()+6)%7;return{W,dn,k:W.s.findIndex(s=>s.d===dn)}};

  if(o&&(o.t==='Course'||o.st))return false;return c.op==='del'?!!o:c.op==='set'&&CT.includes(c.t)&&+c.km>0&&+c.km<=60};
const chTxt=c=>{const p=planAt(c.date),o=p&&p.k>=0?p.W.s[p.k]:null,dt=new Date(c.date+'T12:00:00'),d=DN[(dt.getDay()+6)%7]+' '+dt.getDate(),a=o?o.t+' '+o.km+' km':'';

    plan:S.plan?S.plan.weeks.filter(W=>W.w>=now).slice(0,4).map(W=>{const res=matchWeek(W);return{sem:iso(new Date(W.w)),phase:W.ph,s:W.s.map((s,i)=>({date:iso(sd(W.w,s.d)),j:DN[s.d],t:s.t,km:s.km,st:{ok:'fait',ko:'manqué',todo:'à faire'}[sStatus(W,s,res[i],tk)]}))}}):[],

async function coachSend(t){const c=SC(),q=(t||'').trim();if(!q||cv.busy)return;
  if(!c){alert("Renseigne d'abord le Worker dans Réglages > Strava et coach IA.");return}
  S.coach=S.coach||{msgs:[]};const M=S.coach.msgs;M.push({r:'u',t:q});cv.busy=1;cv.draft='';render();
  try{
    const ms=M.slice(-7).map((m,i,a)=>({role:m.r==='u'?'user':'assistant',content:i===a.length-1?'CONTEXTE: '+coachCtx()+'\n\nMESSAGE: '+m.t:m.t}));
    while(ms.length&&ms[0].role!=='user')ms.shift();
    const r=await fetch(c.url.replace(/\/$/,'')+'/coach',{method:'POST',headers:{Authorization:'Bearer '+c.key,'Content-Type':'application/json'},body:JSON.stringify({system:COACH_SYS,messages:ms})});

    const raw=(await r.json()).text||'';let o;try{o=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch(e){o={reply:raw}}

  }catch(e){M.pop();cv.draft=q;toast('Coach indisponible ('+e.message+')')}
  cv.busy=0;save();render()}

    const o=orig&&orig.t===c.t?{...orig}:{...(TP[c.t]||{})};o.d=dn;o.t=c.t;o.km=+c.km;delete o.mv;const x=String(c.txt||'').trim().slice(0,160);x?o.custom=x:delete o.custom;
    W.s.push(o);W.s.sort((a,b)=>a.d-b.d)});
  m.ap=1;m.u=1;save();toast('Plan mis à jour')}

    if(S.a.editIdx===undefined){const t=S.t.find(t=>t.name===S.a.name),x=t&&t.ex.find(x=>x.name===o);if(x&&confirm('Renommer aussi dans la séance type « '+t.name+' » ?'))x.name=n}save()}
  else if(a==='rn'){const o=b.dataset.n,n=(prompt('Nouveau nom pour « '+o+' » (partout : historique et séances types)',o)||'').trim();if(!n||n===o)return;
    S.h.forEach(h=>h.ex.forEach(e=>{if(e.name===o)e.name=n}));S.t.forEach(t=>t.ex.forEach(e=>{if(e.name===o)e.name=n}));if(S.a)S.a.ex.forEach(e=>{if(e.name===o)e.name=n});save()}
  else if(a==='connect'){const c=SC();if(!c)setSv("Renseigne d'abord l'adresse du Worker et la clé.");else window.open(c.url.replace(/\/$/,'')+'/connect?key='+encodeURIComponent(c.key),'_blank')}
  else if(a==='syncnow')await syncRuns();
  else if(a==='mv'){const L=ed?ed.ex:S.a.ex,j=i+(+b.dataset.d);if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];if(!ed)save();else ed.open=j}}
  else if(a==='skip'){S.a.ex[i].skip=!S.a.ex[i].skip;save()}
  else if(a==='remset'){S.a.ex[i].sets.pop();save()}
  else if(a==='chrono'){
    if(tm&&tm.i===i){S.a.ex[i].rest=Math.round((Date.now()-tm.t)/1000);tm=null;save()}else tm={i,t:Date.now()}}
  else if(a==='cancel'){if(!confirm(S.a.editIdx!==undefined?'Annuler les modifications ?':'Abandonner cette séance ?'))return;S.a=null;tm=null;save()}
  else if(a==='finish'){
    const ex=S.a.ex.map(e=>e.skip?{...e,sets:[]}:{...e,sets:e.sets.filter(s=>+(e.t==='cardio'?s.d:s.r)>0).map(s=>({...s,done:true}))}).filter(e=>e.skip||e.sets.length);
    if(!ex.length&&!confirm('Aucune série validée. Terminer quand même ?'))return;
    const o={...S.a,ex};if(S.a.editIdx!==undefined){delete o.editIdx;S.h[S.a.editIdx]=o}else{o.dur=Math.round((Date.now()-new Date(S.a.date))/60000);S.h.push(o)}S.a=null;tm=null;save();view='hist';toast('Séance enregistrée')}
  else if(a==='export'){const j=JSON.stringify(S);
    try{navigator.share?await navigator.share({text:j}):(await navigator.clipboard.writeText(j),alert('Sauvegarde copiée.'))}catch(e){}return}
  else if(a==='import'){const j=prompt('Colle ta sauvegarde');if(!j)return;try{S=JSON.parse(j);save()}catch(e){alert('Sauvegarde invalide.');return}}
  render();
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset.k,e=t.dataset.e;
  if(k){const p=k.split('.'),x=S.a.ex[p[0]];
    if(p.length===2)x[p[1]]=t.value;else x.sets[p[1]][p[2]]=t.type==='checkbox'?t.checked:t.value;save()}
  else if(e){const p=e.split('.');
    if(p.length===1)ed[p[0]]=t.value;else ed.ex[p[0]][p[1]]=t.type==='number'?+t.value:t.value.trim()}
  else if(t.dataset.s){const c=JSON.parse(localStorage.getItem('fitlog-sync')||'{}');c[t.dataset.s]=t.value.trim();localStorage.setItem('fitlog-sync',JSON.stringify(c));if(CFG()&&!stT)push()}
  else if(t.dataset.p){const c=JSON.parse(localStorage.getItem('fitlog-strava')||'{}');c[t.dataset.p]=t.value.trim();localStorage.setItem('fitlog-strava',JSON.stringify(c))}
  else if(t.dataset.q){sx[t.dataset.q]=t.dataset.q==='km'?+t.value:t.value}
  else if(t.dataset.g){ge[t.dataset.g]=['long','dist','base'].includes(t.dataset.g)?+t.value:t.value}
  else if(t.dataset.zn){const[k,i]=t.dataset.zn.split('.'),z=[...zones()[k]];z[+i]=+t.value;S.zones={...(S.zones||{}),[k]:z};save()}
  if(t.dataset.e&&t.tagName==='SELECT')render();
});
let wl;async function keep(){try{if(!wl||wl.released)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(S.a&&!document.hidden)keep();if(!document.hidden){autoSync();if(Date.now()-lastChk>18e5)checkUpdate();if(AU()&&Date.now()-lastCS>6e4)cloudSync(true)}if(document.hidden&&pt){clearTimeout(pt);pt=0;pushAll()}});
setInterval(()=>{const el=$('#el');if(el&&S.a){const t=Math.floor((Date.now()-new Date(S.a.date))/1000);el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}if(tm){const b=document.querySelector('[data-a=chrono][data-i="'+tm.i+'"]');if(b)b.textContent='Stop '+Math.round((Date.now()-tm.t)/1000)+' s'}},1000);
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='cq'){ev.preventDefault();coachSend(ev.target.value)}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
document.addEventListener('focusout',()=>setTimeout(()=>{scrollTo(0,0);fitNav()},120));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('focusin',e=>{const t=e.target;if(t.tagName==='INPUT'&&t.type==='number')setTimeout(()=>{try{t.select()}catch(x){}},0)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(S.t.length||S.h.length)localStorage.setItem('fitlog-onb','1');
render();
autoSync();
if(!localStorage.getItem('fitlog-onb'))showOnb();else if(needLogin())showLogin();else if(AU())cloudSync(true);
const fitNav=()=>{try{document.documentElement.style.setProperty('--nh',document.querySelector('nav').offsetHeight+'px')}catch(e){}};
fitNav();addEventListener('resize',fitNav);addEventListener('orientationchange',fitNav);
setTimeout(checkUpdate,4000);
