/* ===== Menhir « Lande » : sombre par défaut, clair selon le téléphone ou le réglage ===== */
@font-face{font-family:"Archivo";src:url(archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--bg:#0e1416;--s1:#151d20;--s2:#1d272b;--s3:#283439;--ln:rgba(225,240,235,.08);--tx:#edf2f0;--t2:#b8c5c1;--mut:#7e8d89;
--y:#f2609f;--yr:242,96,159;--on:#22060f;--yd:#a3245e;--yl:#ffc1dc;--au:#f0b94a;--aud:#a8740e;--ok:#3ccb8a;--rd:#ff6b57;--wh:#edf2f0;
--z0:#3ccb8a;--z1:#f0b94a;--z2:#ff8a3d;--z3:#ff5468;--sh:rgba(0,0,0,.55);
--hl:rgba(255,255,255,.035);--csh:inset 0 1px 0 rgba(255,255,255,.04),0 10px 28px -12px rgba(0,0,0,.55);--glass:rgba(23,31,34,.88);--glow:rgba(var(--yr),.13);
--fh:"Archivo",-apple-system,system-ui,sans-serif;--fb:-apple-system,"SF Pro Text",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box}
:root[data-mode=light]{--bg:#edf1ef;--s1:#fff;--s2:#e4eae7;--s3:#d3dcd8;--ln:rgba(18,34,29,.1);--tx:#102019;--t2:#3a4b45;--mut:#66766f;
--y:#c2236a;--yr:194,35,106;--on:#fff;--yd:#8e1a4e;--yl:#f7c6db;--au:#b07a12;--aud:#7a5307;--ok:#13865a;--rd:#d63b2b;--wh:#102019;
--z0:#1f9e68;--z1:#c9921c;--z2:#e0661f;--z3:#d63b4b;--sh:rgba(16,32,25,.18);--hl:rgba(255,255,255,0);--csh:0 1px 2px rgba(16,32,25,.05),0 10px 26px -10px rgba(16,32,25,.14);--glass:rgba(255,255,255,.88);--glow:rgba(var(--yr),.09);color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-mode=dark]){--bg:#edf1ef;--s1:#fff;--s2:#e4eae7;--s3:#d3dcd8;--ln:rgba(18,34,29,.1);--tx:#102019;--t2:#3a4b45;--mut:#66766f;
--y:#c2236a;--yr:194,35,106;--on:#fff;--yd:#8e1a4e;--yl:#f7c6db;--au:#b07a12;--aud:#7a5307;--ok:#13865a;--rd:#d63b2b;--wh:#102019;
--z0:#1f9e68;--z1:#c9921c;--z2:#e0661f;--z3:#d63b4b;--sh:rgba(16,32,25,.18);--hl:rgba(255,255,255,0);--csh:0 1px 2px rgba(16,32,25,.05),0 10px 26px -10px rgba(16,32,25,.14);--glass:rgba(255,255,255,.88);--glow:rgba(var(--yr),.09);color-scheme:light}}

/* ----- base ----- */
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
@media (display-mode:standalone){html{min-height:min(100lvh,calc(100% + env(safe-area-inset-top)))}}
body{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;background:radial-gradient(120% 50% at 90% -10%,var(--glow),transparent 60%),var(--bg);color:var(--tx);font:16px/1.4 var(--fb);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
/* iPhone (app installée) : l'heure et la batterie sont toujours en blanc. Depuis iOS 26, l'iPhone pose lui-même un léger voile sombre derrière ; avant (classe sbk), une bande sombre les garde lisibles en mode clair. */
:root.sbk[data-mode=light] body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#102019;z-index:100;pointer-events:none}
@media (prefers-color-scheme:light){:root.sbk:not([data-mode=dark]) body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#102019;z-index:100;pointer-events:none}}
main{position:relative;z-index:1;flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(env(safe-area-inset-top) + 10px) 20px calc(var(--nh,76px) + 16px)}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
input:focus-visible,select:focus-visible{outline:none}

/* ----- typographie : Archivo élargie pour les titres et les chiffres ----- */
h1{font:800 34px/1.02 var(--fh);font-stretch:118%;letter-spacing:-.015em;margin:0}
h2{font-size:17px;font-weight:650;letter-spacing:-.3px;margin:0 0 2px}
.hv,.rtm,.gt,.rgn,.big,.hero h2,.hof h2,.fml,.rtt b,.rhs b,.bigv b,.tile b,.tiles3 b,.dtile b,.tld b,.rrk b,.exn,.chip.tm,.rch b{font-family:var(--fh);font-stretch:112%}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.empty{color:var(--mut);text-align:center;padding:40px 10px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 22px}
.top .row h1{font-size:26px;font-stretch:106%}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 0 16px}
.eyb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--y);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.rb{width:44px;height:44px;border-radius:50%;padding:0;flex:none;display:grid;place-items:center;background:var(--s2);font:300 28px/1 var(--fb);color:var(--tx);box-shadow:var(--csh)}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 4px 10px}
.logo{width:38px;height:38px;border-radius:10px;flex:none}.logo.lg{width:104px;height:104px;border-radius:24px;margin-bottom:18px}

/* ----- surfaces ----- */
.card{background:linear-gradient(180deg,var(--hl),transparent 42%) var(--s1);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--csh)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>span.n{width:26px;height:26px;border-radius:50%;background:var(--s2);color:var(--mut);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}
.g,.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{background:var(--s1);border:1px solid var(--ln);border-radius:22px;margin-bottom:10px;overflow:hidden;box-shadow:var(--csh)}
.acc>button{display:flex;align-items:center;gap:10px;width:100%;background:none;border-radius:0;padding:15px 16px;text-align:left;font-weight:600;font-size:16px}
.acc>button>span{flex:1}.acc small{color:var(--mut);font-weight:400;font-size:13px}.acc.open .chev{transform:rotate(90deg)}
.acc .body{padding:0 16px 16px}.acc .card{background:none;border:0;padding:0;margin:0}.acc .card>h2{display:none}

/* ----- champs ----- */
input,select{background:var(--s2);color:var(--tx);border:1px solid transparent;border-radius:12px;padding:12px 8px;font-size:18px;font-weight:600;width:100%;min-width:0;text-align:center;text-align-last:center;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:rgba(var(--yr),.7)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input[type=range]{background:transparent;border:0;padding:0;height:30px;margin:2px 0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--s3);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--y);border:0;margin-top:-11px}
input[type=range]::-moz-range-track{height:4px;background:var(--s3);border-radius:2px}input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--y);border:0}

/* ----- boutons ----- */
button{background:var(--s2);color:var(--tx);border:0;border-radius:14px;padding:13px 16px;font:600 15px var(--fb);transition:transform .12s,opacity .12s}
button:active{transform:scale(.97);opacity:.8}
button.p,button.sm.on{background:linear-gradient(180deg,color-mix(in srgb,var(--y),#fff 12%),var(--y));color:var(--on);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 22px -10px rgba(var(--yr),.75)}
button.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;margin-top:14px;font-size:16.5px;border-radius:16px}button.big svg{width:18px;height:18px;fill:currentColor}
button.add{display:block;width:100%;background:none;border:1.5px dashed var(--s3);color:var(--t2);border-radius:18px;padding:14px;margin:4px 0 12px;font-weight:600}
button.d{background:none;color:var(--rd)}
button.gh{background:none;color:var(--mut);font-weight:500;padding:10px 8px}button.gh.d{color:var(--rd)}
button.sm{padding:9px 16px;font-size:14px;border-radius:12px}
button.sm,button.more,.seg button,.chips button{min-height:44px}
button.more{background:none;color:var(--mut);padding:6px 8px;font-size:20px;line-height:1;letter-spacing:1px;border-radius:10px;min-width:44px}
button.more.plus{font-size:30px;font-weight:300;color:var(--tx);letter-spacing:0;padding:2px 10px}
.more svg,nav svg,.sb svg,.ico svg,.chev{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;display:block}
.more svg{width:24px;height:24px;stroke-width:1.7}
.bar{display:flex;gap:8px;margin-top:10px}.bar button{flex:1}
button.mc{padding:14px 4px;font-size:13px;background:var(--s2);border:1.5px solid transparent;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px}
button.mc small{font-size:10px;opacity:.85;font-weight:500}button.mc.p{background:var(--y);color:var(--on)}button.mc.s{background:transparent;border-color:var(--y);color:var(--y)}
button.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:14px 16px;margin-bottom:10px;font-weight:400;box-shadow:var(--csh)}
.item>div:not(.ico){flex:1;min-width:0}.item b{display:block;font-size:16px;font-weight:650;letter-spacing:-.2px}.item .sub{margin:2px 0 0}
.ico{width:42px;height:42px;border-radius:13px;background:var(--s2);color:var(--y);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;stroke-width:1.8}
.chev{width:18px;height:18px;stroke-width:1.8;color:var(--mut);flex:none;transition:transform .2s}

/* ----- barre d'onglets : capsule de verre flottante, l'onglet actif en pastille bruyère ----- */
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom)*.35 + 4px);z-index:5;display:flex;gap:4px;max-width:520px;margin:0 auto;padding:4px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--ln);border-radius:26px;box-shadow:0 14px 34px -10px var(--sh)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--mut);padding:6px 0 4px;border-radius:22px;font-size:10.5px;font-weight:650;transition:background .2s,color .2s}
nav button.on{color:var(--y);background:rgba(var(--yr),.13)}
nav svg{width:23px;height:23px;stroke-width:1.8}

/* ----- accueil : carte du jour avec courbes de niveau ----- */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(var(--yr),.15),transparent 58%) var(--s1);border:1px solid var(--ln);border-radius:26px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--csh)}
.hero>*{position:relative}
.hero>.topo{position:absolute;top:-6px;right:-18px;width:250px;height:156px;fill:none;stroke:var(--y);stroke-width:1;opacity:.3;pointer-events:none}
:root[data-mode=light] .hero>.topo{opacity:.2}@media (prefers-color-scheme:light){:root:not([data-mode=dark]) .hero>.topo{opacity:.2}}
.hero .k{font-size:13px;font-weight:600;color:var(--mut)}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:2px 0}
.hero .sub{margin:0}.hero button{width:100%;margin-top:10px;padding:12px;font-size:15px}.hero button.more{width:auto;margin:-6px -8px 0 0;padding:6px 8px;font-size:20px}.hero button.big{padding:15px;margin-top:14px}
.hstats{display:flex;gap:24px;margin:8px 0 2px}.hstats .sub{margin:4px 0 0}
.hv{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}.hv small{font-family:var(--fb);font-size:15px;color:var(--mut);font-weight:500;letter-spacing:0}
.hero .hv{font-size:28px}
.hk{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hb{display:flex;gap:8px}.hb button:first-child{flex:1}.hero .hb button:last-child{flex:none;width:58px;padding-left:0;padding-right:0;font-size:19px}
#app.hm{padding-bottom:calc(var(--nh,76px) + 8px)}#app.hm .top{margin:4px 0 8px}#app.hm .hero button:not(.fmp){margin-top:8px;padding:11px}#app.hm h1{font-size:27px}#app.hm button.item{padding:7px 14px;margin-bottom:6px}#app.hm .hero{margin-bottom:8px}#app.hm>button.item:last-child{margin-top:6px!important}#app.hm .ico{width:38px;height:38px}#app.hm .card{padding:12px 16px;margin-bottom:8px}#app.hm .hero{padding:12px 16px}#app.hm .hero .hv{font-size:26px}
.fmp{background:var(--s2);color:var(--t2);border-radius:20px;padding:5px 11px 5px 9px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:30px;flex:none}
.hero button.fmp{width:auto;margin:0;padding:5px 11px 5px 9px;font-size:12.5px}
.fmp i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:block}.fmp.go i{background:var(--ok)}.fmp.adapt i,.fmp.rp i{background:var(--y)}.fmp.rest i{background:var(--rd)}

/* ----- éléments communs ----- */
.pill{display:inline-block;background:var(--s2);color:var(--t2);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;margin:0 4px 4px 0}
button.pill{min-height:36px}
.pr{border:1px solid rgba(var(--yr),.45);color:var(--y);border-radius:8px;padding:1px 6px;font-size:11px;font-weight:600}.pr.nw{background:rgba(var(--yr),.14)}
.big{font-size:20px;font-weight:800;color:var(--tx);white-space:nowrap;flex:none}
#el{color:var(--tx);font-size:15px}
.prog{height:4px;border-radius:2px;background:var(--s3);margin:8px 0 6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y);border-radius:2px}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:999px;padding:3px;margin-bottom:16px;box-shadow:var(--csh)}
.seg button{flex:1;background:none;border-radius:999px;padding:9px 4px;font-size:14px;color:var(--mut);transition:background .2s,color .2s}.seg button.on{background:var(--tx);color:var(--bg);box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 8px;padding:0 20px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;font-size:14px;border-radius:20px;background:var(--s2);color:var(--t2)}.chips button.on{background:var(--y);color:var(--on)}
.toast{position:fixed;left:50%;bottom:calc(var(--nh,76px) + 14px);transform:translateX(-50%);max-width:88%;text-align:center;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:90;animation:in .2s ease both}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}

/* ----- feuilles (menus du bas) ----- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:rgba(5,10,9,.55);animation:fade .2s both}
.sh-box{position:relative;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--s1);border-radius:28px 28px 0 0;padding:8px 20px calc(14px + env(safe-area-inset-bottom));animation:up .25s ease both}
.sh-box .grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 6px}
.sh-box button{display:block;width:100%;text-align:left;background:none;border-radius:0;border-bottom:1px solid var(--ln);padding:16px 2px;font-size:17px;font-weight:500}
.sh-box button.d{color:var(--rd)}.sh-box button:last-child{border:0}
.sh-t{font:800 18px/1.2 var(--fh);font-stretch:108%;padding:8px 2px 4px}.sh-s{font-size:13px;color:var(--mut);padding:0 2px 6px}
.sh-box button.shi{display:flex;flex-direction:column;gap:3px;padding:13px 2px}.shi b{font-size:16px;font-weight:650}.shi small{font-size:12.5px;color:var(--mut);font-weight:500}

/* ----- mouvement : seulement en réponse à une action ----- */
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.fx>*{animation:in .3s ease both}.fy>*:not(.seg):not(.top){animation:in .22s ease both}
@media (prefers-reduced-motion:reduce){button{transition:none}.fy>*,.fx>*,.toast,.sh-box,.sh-bg,.rc{animation:none}}

/* ----- plan ----- */
.prow{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.prow .pill{margin:2px 0 0;min-width:58px;text-align:center}
button.pbody{flex:1;min-width:0;display:block;background:none;text-align:left;padding:0;border-radius:8px;font-weight:400;font-size:16px}
.pbody b{display:block;font-weight:650;letter-spacing:-.2px}.pbody .sub{display:block;margin:2px 0 0}
button.sb{background:none;padding:2px;color:var(--mut);flex:none;border-radius:50%;min-width:44px;min-height:44px;display:grid;place-items:center}
.sb svg{width:28px;height:28px;stroke-width:1.7}.sb.ok{color:var(--ok)}.sb.ko{color:var(--rd)}

const SWAP='<svg viewBox="0 0 24 24"><path d="M7 4 4 7l3 3M4 7h12a4 4 0 0 1 4 4M17 20l3-3-3-3M20 17H8a4 4 0 0 1-4-4"/></svg>',

return`<div class="card exc${dn?' done':''}" data-di=${i}>${head}<div class=sth><span>Série</span><span>${e.eq==='c'?'Lest kg':'kg'}</span><span>${u}</span><span></span></div>`

function history(){

+acc('h1','Muscu : faire une séance','',H(`<p><b>1. Créer.</b> Dans Muscu > Séances, touche « + » : crée une séance ou choisis un <b>programme type</b> (poids du corps, salle, coureur…). « + Ajouter un exercice » ouvre une bibliothèque de plus de 150 exercices avec les muscles travaillés, ou te laisse créer le tien. Pour changer l'ordre, appuie longuement sur un exercice puis glisse-le.</p><p><b>2. Démarrer.</b> Touche « Démarrer » : Menhir pré-remplit la charge et les répétitions à viser, d'après ta dernière séance.</p><p><b>3. Noter.</b> Corrige les chiffres si tu as fait autre chose et coche chaque série faite (le repos se lance). Ajoute une série avec « + Série » (pour en retirer une : menu « ··· » de l'exercice). Il manque un exercice ? « + Ajouter un exercice » marche aussi en pleine séance. Puis « Terminer la séance ».</p><p><b>4. Progresser.</b> À la séance suivante, la cible est recalculée toute seule (voir « Double progression » dans le glossaire).</p><p>Première fois ? Choisis une charge légère : celle avec laquelle tu pourrais faire encore 2 ou 3 répétitions.</p>`))
+acc('h2','Muscu : muscles et records','',H(`<p><b>Muscles.</b> Un corps en 3D s'allume selon les séries des derniers jours (7, 14 ou 30). Vert = peu travaillé, rouge = beaucoup. Touche un muscle pour voir quels exercices le sollicitent. Un exercice n'est pas reconnu ? Touche-le dans « Exercices et muscles » pour l'associer à un muscle.</p><p><b>Records.</b> Ta meilleure charge par exercice et ton 1RM estimé (voir le glossaire).</p>`))

+acc('h3b','Forme du jour, allures et séance guidée','',H(`<p><b>Forme du jour.</b> Touche « Ma forme ? » sur l'accueil et réponds à 3 questions (sommeil, énergie, jambes). Menhir croise ton ressenti avec ta charge de course <b>et</b> de muscu des 4 dernières semaines, et avec tes séries de jambes récentes. Verdict : feu vert, à adapter ou récupération. Il peut alléger la séance du jour en un geste.</p><p><b>Allures.</b> Course > Records : tes allures d'endurance, de seuil et de fractionné, calculées d'après ton meilleur record (méthode VDOT de Jack Daniels).</p><p><b>Séance guidée.</b> Bouton ▶ sur l'accueil ou dans une séance du plan : une voix annonce chaque étape et un bip marque les changements. Garde l'écran allumé.</p><p><b>Repos.</b> En séance de muscu, coche une série (✓) : le repos démarre tout seul, avec bips et vibration à la fin. Sa durée est calculée selon l'exercice (plus long sur les gros mouvements lourds, plus court sur l'isolation et le gainage) et le type de séance. Pour la changer, touche le réglage à côté du chrono : ton choix est retenu pour cet exercice. Les boutons −15 et +15 du minuteur ne valent que pour la séance en cours.</p><p><b>Machine prise ?</b> Touche les deux flèches à côté d'un exercice : Menhir te propose des exercices qui travaillent les mêmes muscles, avec un autre matériel en priorité. Le changement ne vaut que pour cette séance.</p><p><b>Importer.</b> Réglages > Données : fichiers CSV de Strong ou Hevy, fichiers GPX ou TCX (Garmin, Coros, Suunto…).</p><p><b>Calendrier.</b> Course > Plan > « ··· » > Ajouter le plan à mon calendrier : tes séances avec un rappel 1 h avant.</p><p><b>Chaussures.</b> Course > Sorties > Chaussures : le kilométrage de ta paire, avec une alerte avant l'usure.</p>`))

+acc('h5','Glossaire','Les mots techniques',H(`<dl><dt>Série</dt><dd>Un bloc de répétitions d'affilée, suivi d'un repos.</dd><dt>Répétition (rep)</dt><dd>Un mouvement complet de l'exercice.</dd><dt>Charge</dt><dd>Le poids soulevé, en kg.</dd><dt>Pas</dt><dd>L'écart dont la charge augmente quand tu progresses (par exemple 2,5 kg).</dd><dt>Double progression</dt><dd>Tu vises un nombre de répétitions entre un minimum et un maximum. Quand tu atteins le maximum sur toutes les séries, la charge augmente et tu repars du minimum.</dd><dt>1RM estimé</dt><dd>La charge maximale théorique pour une seule répétition, calculée d'après tes séries. C'est une estimation, pas un test.</dd><dt>Gainage</dt><dd>Exercice où l'on tient une position (planche…). On compte en secondes.</dd><dt>Smith machine</dt><dd>Barre guidée sur rails verticaux, présente en salle.</dd><dt>Allure</dt><dd>Minutes par kilomètre (par exemple 5:30 /km).</dd><dt>D+</dt><dd>Dénivelé positif : les mètres gagnés en montée pendant la sortie.</dd><dt>FC et zones cardiaques</dt><dd>FC = fréquence cardiaque, en battements par minute. Les zones (endurance, tempo, fractionné) donnent la FC cible de chaque type de sortie. Tu peux les ajuster dans Réglages.</dd><dt>Semi</dt><dd>Semi-marathon : 21,1 km.</dd><dt>Sortie longue</dt><dd>La sortie la plus longue de la semaine, à allure tranquille.</dd></dl>`))

const LEG=[["Qui édite Menhir", ["Menhir est un projet personnel, gratuit et sans but commercial, édité par un particulier. Aucune publicité, aucun suivi statistique, aucune revente de données.", "Contact (questions, demandes sur tes données) : <b class=ct>le contact indiqué par l'éditeur de l'app</b>."]], ["Ce qui est enregistré", ["<b>Sur ton téléphone</b> : tes séances, sorties, objectifs, réglages et ton ressenti du jour (sommeil, énergie, jambes) (stockage local de l'app, aucun cookie de suivi).", "<b>Si tu crées un compte</b> (facultatif) : ton e-mail, ton mot de passe (conservé chiffré par le service d'authentification, jamais lisible) et une copie de tes données Menhir.", "<b>Si tu connectes Strava</b> (facultatif) : l'accès à tes activités en lecture seule, et les sorties importées (date, distance, durée, allure, fréquence cardiaque, parcours simplifié). Rien n'est publié sur ton compte Strava.", "<b>Si tu importes des fichiers de montre</b> : la trace GPS et les courbes (fréquence cardiaque, allure, altitude) restent sur ton téléphone ; elles ne sont pas copiées dans la sauvegarde du compte, mais sont incluses quand tu exportes tes données.", "<b>Coach IA</b> (facultatif) : quand tu poses une question, un résumé de tes séances de renfo, de tes comptes rendus et des sorties qui viennent de toi (fichiers de ta montre, archive Strava que tu importes, saisies) est envoyé à un service d'IA (Cloudflare Workers AI ou, si l'éditeur l'a activé, Claude d'Anthropic en offre payante) qui renvoie la réponse. Tu parles à une IA : ses conseils ne remplacent pas un avis médical. Les sorties synchronisées depuis Strava ne sont jamais envoyées. Tu es prévenu avant le premier envoi. Pas de compte requis : ton téléphone est reconnu par une clé aléatoire, utilisée seulement pour limiter les messages par jour."]], ["Pourquoi et combien de temps", ["Ces données servent uniquement à faire fonctionner l'app (stats, plan de course, sauvegarde). Base : ton consentement et l'exécution du service que tu demandes.", "Elles sont gardées tant que tu les gardes : tu les effaces quand tu veux (voir plus bas). Un compte inactif n'est pas utilisé pour autre chose."]], ["Qui les reçoit", ["<b>Supabase</b> : hébergement du compte et de la sauvegarde.", "<b>Cloudflare</b> : serveur qui relaie Strava (il garde ton jeton Strava chiffré côté serveur) et fait tourner le coach IA (Workers AI) : selon ses conditions, il ne s'en sert pas pour entraîner ses modèles et ne garde pas le contenu une fois la réponse donnée. <b>Anthropic (Claude)</b> : seulement si l'éditeur a activé son offre payante pour l'API ; selon ses conditions commerciales, le contenu envoyé par l'API n'est pas utilisé pour entraîner ses modèles.", "<b>Cartes</b> : quand tu ouvres la carte d'une sortie, ton téléphone télécharge le fond de carte depuis OpenStreetMap et l'outil d'affichage Leaflet depuis cdnjs (Cloudflare). Ces serveurs voient ton adresse IP, jamais tes données d'entraînement.", "<b>Strava</b> : si tu le connectes. Les données Strava ne servent qu'à toi, ne sont montrées à personne d'autre et ne servent jamais à entraîner une IA.",  "Certains de ces services sont situés hors de l'Union européenne ; ils appliquent des garanties reconnues (clauses contractuelles types)."]], ["Tes droits", ["Tu peux accéder à tes données, les corriger, les exporter (Réglages > Données > Exporter), les effacer (Réglages > Données > Supprimer, et Réglages > Compte > Supprimer mon compte) ou t'opposer à leur usage, à tout moment et gratuitement.", "Déconnecter Strava (onglet Course) révoque l'accès chez Strava et retire les sorties importées. Tu peux aussi le faire sur strava.com > Réglages > Mes applications.", "Pour toute demande, écris au contact ci-dessus. Tu peux aussi saisir la CNIL (cnil.fr) si tu estimes que tes droits ne sont pas respectés."]], ["Âge", ["Menhir est destiné aux personnes de 15 ans et plus."]], ["Santé et sécurité", ["Menhir est un carnet d'entraînement, pas un dispositif médical. Les plans, charges, allures, zones cardiaques et conseils sont indicatifs et ne remplacent pas l'avis d'un médecin.", "Avant de reprendre ou d'intensifier le sport (surtout après une pause, une blessure ou en cas de problème de santé), demande conseil à un professionnel de santé. Arrête si tu ressens une douleur, un malaise ou un essoufflement anormal."]], ["Licences et marques", ["Modèle 3D du corps : BodyParts3D © The Database Center for Life Science, licence CC BY-SA 2.1 JP (dbcls.rois.ac.jp), adapté pour Menhir.", "« Strava » et « Propulsé par Strava » sont des marques de Strava, Inc. Menhir n'est ni affilié ni approuvé par Strava.", "Cartes : données © les contributeurs d'OpenStreetMap (licence ODbL), affichées avec Leaflet (licence BSD-2). HYROX est une marque de son propriétaire ; Menhir n'est ni affilié ni approuvé par HYROX. Cloudflare est une marque de Cloudflare, Inc. Claude et Anthropic sont des marques d'Anthropic PBC. Le modèle d'IA du coach (Mistral Small) est publié sous licence Apache 2.0. Police Archivo : licence SIL Open Font License 1.1. Les autres noms cités appartiennent à leurs propriétaires."]]];

function matchWeek(W){
const R=(S.runs||[]).filter(r=>wk(rdate(r))===W.w),res=W.s.map(()=>null),P=[],used=new Set();
W.s.forEach((s,i)=>R.forEach(r=>{const d=rday(r)-s.d,k=r.km/(s.km||r.km||1);
if(!d)return P.push([-1-r.km/1e3,i,r]);if(s.st)return;
if(d>0){if(k<.5)return;P.push([d+Math.min(1,Math.abs(1-k))*.4,i,r])}

return res}
