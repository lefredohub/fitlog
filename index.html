<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLog">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>FitLog</title>
<style>
:root{--bg:#000;--s1:#0f1013;--s2:#1a1b20;--s3:#25272e;--ln:rgba(255,255,255,.08);--tx:#f5f5f7;--mut:#8e8e99;--y:#ffd60a;--cy:#64d2ff;--vi:#bf5af2;--ok:#32d74b;--rd:#ff453a;box-sizing:border-box;color-scheme:dark}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 38% at 50% -6%,rgba(255,214,10,.22),transparent 70%),radial-gradient(45% 28% at 100% 100%,rgba(100,210,255,.08),transparent 70%)}
main{position:relative;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(112px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 20px}
h1{font:800 34px/1.05 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-1.2px;margin:0}
.logo{width:46px;height:46px;border-radius:12px;box-shadow:0 0 18px rgba(255,214,10,.35);flex:none}
.logo.lg{width:112px;height:112px;border-radius:26px;margin-bottom:16px}
h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:0 0 2px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:14px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>span.n{width:26px;height:26px;border-radius:50%;background:var(--s3);color:var(--mut);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
input,select{background:var(--s3);color:var(--tx);border:1px solid transparent;border-radius:14px;padding:12px 8px;font-size:19px;font-weight:600;width:100%;min-width:0;text-align:center;text-align-last:center;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,214,10,.18)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{background:var(--s3);color:var(--tx);border:0;border-radius:16px;padding:14px 16px;font:600 16px -apple-system,system-ui,sans-serif;transition:transform .12s,filter .12s}
button:active{transform:scale(.96);filter:brightness(1.25)}
button.p{background:var(--y);color:#000;font-weight:800;box-shadow:0 6px 24px rgba(255,214,10,.28)}
button.d{background:rgba(255,69,58,.12);color:var(--rd)}
.bar{display:flex;gap:10px;margin-top:10px}.bar button{flex:1}
nav{position:fixed;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:32px;background:rgba(28,28,32,.62);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.1);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--mut);padding:9px 0 7px;border-radius:26px;font-size:11px;font-weight:600}
nav button.on{background:rgba(255,214,10,.14);color:var(--y)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;background:var(--s3);color:#c9c9d1;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;margin:0 4px 4px 0}
#el{color:var(--y);background:rgba(255,214,10,.12);font-size:15px}
.pr{background:rgba(191,90,242,.2);color:#d9a0ff;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700}
.big{font-size:20px;font-weight:800;color:var(--y);letter-spacing:-.5px}
.empty{color:var(--mut);text-align:center;padding:36px 10px 28px}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body><main id="app"></main>
<nav><button data-a="nav" data-v="home"><svg viewBox="0 0 24 24"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>Séances</button><button data-a="nav" data-v="hist"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg>Historique</button></nav>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('fitlog'))}catch(e){}
S=S||{t:[],h:[],a:null};
let pt=0,stT='';
const save=()=>{localStorage.setItem('fitlog',JSON.stringify(S));if(CFG()){clearTimeout(pt);pt=setTimeout(()=>{pt=0;push()},6000)}};
const CFG=()=>{try{const c=JSON.parse(localStorage.getItem('fitlog-sync'));return c&&c.repo&&c.token?c:null}catch(e){return null}};
const setSt=t=>{stT=t;const e=$('#st');if(e)e.textContent=t};
const b64=t=>btoa(unescape(encodeURIComponent(t)));
const API=c=>`https://api.github.com/repos/${c.repo}/contents/fitlog.json`;
const HD=(c,a='application/vnd.github+json')=>({Authorization:'Bearer '+c.token,Accept:a});
async function push(){const c=CFG();if(!c)return;
  try{let sha;const g=await fetch(API(c),{headers:HD(c)});
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status);
    const r=await fetch(API(c),{method:'PUT',headers:HD(c),body:JSON.stringify({message:'sauvegarde '+new Date().toISOString(),content:b64(JSON.stringify(S)),sha})});
    if(!r.ok)throw new Error(r.status);
    setSt('Dernière sauvegarde : '+new Date().toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))
  }catch(e){setSt('Échec de la sauvegarde ('+e.message+')')}}
async function pull(){const c=CFG();if(!c){setSt('Renseigne le dépôt et le jeton.');return}
  try{const r=await fetch(API(c),{headers:HD(c,'application/vnd.github.raw+json')});if(!r.ok)throw new Error(r.status);
    const d=JSON.parse(await r.text());if(!confirm('Remplacer les données de ce téléphone par la sauvegarde ?'))return;
    S=d;localStorage.setItem('fitlog',JSON.stringify(S));setSt('Données restaurées.')
  }catch(e){setSt('Échec de la restauration ('+e.message+')')}}
function syncCard(){const c=CFG()||JSON.parse(localStorage.getItem('fitlog-sync')||'{}');
  return`<div class=card><h2>Sauvegarde automatique</h2><div class=sub id=st>${esc(stT||(CFG()?'Active : sauvegarde après chaque modification.':'Non configurée.'))}</div><label>Dépôt GitHub privé</label><input style="text-align:left" data-s=repo placeholder="pseudo/fitlog-data" autocapitalize=none autocorrect=off value="${esc(c.repo||'')}"><label>Jeton d'accès</label><input type=password style="text-align:left" data-s=token placeholder="github_pat_…" autocapitalize=none value="${esc(c.token||'')}"><div class=bar><button data-a=pushnow>Sauvegarder</button><button data-a=pull>Restaurer</button></div></div>`}
let view='home',ed=null,tm=null;
const LOGO=(c='logo')=>`<img class="${c}" src="icon-180.png" alt="">`;
const mv=i=>`<button data-a=mv data-i=${i} data-d=-1 style="padding:8px 11px;font-size:14px">↑</button><button data-a=mv data-i=${i} data-d=1 style="padding:8px 11px;font-size:14px">↓</button>`;
const METH={double:'Double progression',linear:'Surcharge linéaire',volume:'Progression en volume'};

function last(name){for(let i=S.h.length-1;i>=0;i--){const e=S.h[i].ex.find(x=>x.name===name);if(e&&e.sets.some(s=>s.done))return e}return null}

// Calcule la cible de la prochaine séance pour un exo du modèle
function target(x){
  let w=+x.w||0,r=+x.min||1,n=+x.sets||3;const l=last(x.name);
  if(!l)return{w,r,n};
  const ds=l.sets.filter(s=>s.done),lw=+ds[0].w||w,ln=l.sets.length;
  const minR=Math.min(...ds.map(s=>+s.r||0)),rpe=Math.max(...ds.map(s=>+s.rpe||0)),inc=+x.inc||0;
  w=lw;n=ln;r=+x.min;
  if(x.m==='double'){
    if(minR>=+x.max&&rpe<=9){w=lw+inc;r=+x.min;n=+x.sets}
    else r=Math.min(+x.max,Math.max(+x.min,minR+1));
  }else if(x.m==='linear'){
    if(minR>=r&&ds.length>=ln)w=lw+inc;
  }else if(minR>=r){
    if(ln<5)n=ln+1;else{w=lw+inc;n=+x.sets}
  }
  return{w,r,n};
}
function start(id){
  const t=S.t.find(t=>t.id===id);
  S.a={id:uid(),name:t.name,date:new Date().toISOString(),ex:t.ex.map(x=>{
    if(x.t==='cardio'){const l=last(x.name),p=l&&l.sets.find(s=>s.done),d=p?p.d:x.min,v=p?p.l:(x.lvl||'');
      return{name:x.name,t:'cardio',m:x.m,rest:'',tg:`Cible : ${d} min${v?', niveau '+v:''}`,sets:[{d,l:v,done:true}]}}
    const g=target(x);
    return{name:x.name,m:x.m,rest:'',tg:`Cible : ${g.n}×${g.r}${x.m==='double'?'–'+x.max:''} à ${g.w} kg`,
      sets:Array.from({length:g.n},()=>({w:g.w,r:g.r,rpe:'',done:true}))}})};
  save();render();
}
function fmt(e){if(e.skip)return'Pas fait';if(e.t==='cardio')return e.sets.filter(s=>s.done).map(s=>`${s.d} min${s.l?' · niveau '+s.l:''}`).join(', ')||'—';return e.sets.filter(s=>s.done).map(s=>`${s.r}×${s.w}kg`).join(', ')||'—'}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#app').innerHTML=ed?editor():view==='hist'?history():S.a?session():home();
  if(S.a&&!ed)keep();
}
function home(){
  return`<div class=top><h1>Séances</h1>${LOGO()}</div>`+(S.t.length?S.t.map(t=>`<div class=card><h2>${esc(t.name)}</h2><div style="margin:8px 0 14px">${t.ex.map(x=>`<span class=pill>${esc(x.name)}</span>`).join('')||'<span class=sub>Aucun exercice</span>'}</div><div class=bar><button class=p data-a=start data-id=${t.id}>Démarrer</button><button data-a=edit data-id=${t.id}>Modifier</button></div></div>`).join(''):`<div class=empty>${LOGO('logo lg')}<br>Aucune séance.<br>Crée la première avec ses exercices.</div>`)
  +`<button class=p style="width:100%" data-a=new>Créer une séance</button>`;
}
function session(){
  const a=S.a;
  const E=a.editIdx!==undefined;
  return`<div class=top><h1>${E?'Modifier : ':''}${esc(a.name)}</h1>${E?'':'<span class=pill id=el>00:00</span>'}</div>`+a.ex.map((e,i)=>e.skip?`<div class=card style="opacity:.55"><div class=row style="justify-content:space-between;margin:0"><div><h2>${esc(e.name)}</h2><div class=sub style="margin:0">Pas fait</div></div><button data-a=skip data-i=${i} style="padding:8px 12px;font-size:14px">Annuler</button></div></div>`:e.t==='cardio'?`<div class=card><div class=row style="justify-content:space-between;margin:0 0 4px"><h2>${esc(e.name)}</h2><span style="display:flex;gap:6px">${mv(i)}<button data-a=skip data-i=${i} style="padding:8px 12px;font-size:14px">Pas fait</button></span></div><div class=sub>${e.tg}</div><div class=row><div style="flex:1"><label>Minutes</label><input type=number inputmode=decimal step=any data-k="${i}.0.d" value="${e.sets[0]?e.sets[0].d:''}"></div><div style="flex:1"><label>Niveau</label><input type=number inputmode=decimal step=any data-k="${i}.0.l" value="${e.sets[0]?e.sets[0].l:''}"></div></div></div>`:`<div class=card><div class=row style="justify-content:space-between;margin:0 0 4px"><h2>${esc(e.name)}</h2><span style="display:flex;gap:6px">${mv(i)}<button data-a=skip data-i=${i} style="padding:8px 12px;font-size:14px">Pas fait</button></span></div><div class=sub>${e.tg} · ${METH[e.m]}</div>
  <div class=row><span class=n style="background:none"></span><div class=sub style="flex:1;margin:0;text-align:center">kg</div><div class=sub style="flex:1;margin:0;text-align:center">reps</div><div class=sub style="flex:1;margin:0;text-align:center">RPE</div></div>`
  +e.sets.map((s,j)=>`<div class=row><span class=n>${j+1}</span><input type=number inputmode=decimal step=any data-k="${i}.${j}.w" value="${s.w}"><input type=number inputmode=numeric data-k="${i}.${j}.r" value="${s.r}"><select data-k="${i}.${j}.rpe"><option value="">–${[6,7,8,9,10].map(v=>`<option${s.rpe==v?' selected':''}>${v}`).join('')}</select></div>`).join('')
  +`<div class=row><button data-a=addset data-i=${i}>+ Série</button><button data-a=remset data-i=${i}>− Série</button></div><div class=row><input type=number inputmode=numeric placeholder="repos (s)" data-k="${i}.rest" value="${e.rest}"><button data-a=chrono data-i=${i}>${tm&&tm.i===i?'Stop':'Chrono'}</button></div></div>`).join('')
  +`<div class=bar>${E?'<button class=d data-a=dellog>Supprimer</button>':''}<button class=d data-a=cancel>${E?'Annuler':'Abandonner'}</button><button class=p data-a=finish>${E?'Enregistrer':'Terminer'}</button></div>`;
}
function editor(){
  return`<div class=top><h1>${ed.new?'Nouvelle séance':'Modifier la séance'}</h1></div><div class=card><label>Nom de la séance</label><input style="text-align:left" data-e=name value="${esc(ed.name)}"></div>`
  +ed.ex.map((x,i)=>`<div class=card><label>Exercice</label><input style="text-align:left" data-e="${i}.name" value="${esc(x.name)}">
  <label>Type</label><select data-e="${i}.t"><option value="">Muscu<option value=cardio${x.t==='cardio'?' selected':''}>Cardio (minutes)</select>${x.t==='cardio'?`<div class=g><div><label>Durée (min)</label><input type=number inputmode=decimal step=any data-e="${i}.min" value="${x.min}"></div><div><label>Niveau</label><input type=number inputmode=decimal step=any data-e="${i}.lvl" value="${x.lvl||''}"></div></div>`:`<div class=g><div><label>Séries</label><input type=number inputmode=numeric data-e="${i}.sets" value="${x.sets}"></div><div><label>Reps min</label><input type=number inputmode=numeric data-e="${i}.min" value="${x.min}"></div><div><label>Reps max</label><input type=number inputmode=numeric data-e="${i}.max" value="${x.max}"></div><div><label>Charge (kg)</label><input type=number inputmode=decimal step=any data-e="${i}.w" value="${x.w}"></div><div><label>Pas (kg)</label><input type=number inputmode=decimal step=any data-e="${i}.inc" value="${x.inc}"></div></div>
  <label>Méthode de progression</label><select data-e="${i}.m">${Object.entries(METH).map(([k,v])=>`<option value=${k}${x.m===k?' selected':''}>${v}`).join('')}</select>`}<div class=bar>${mv(i)}<button class=d data-a=delex data-i=${i}>Retirer l'exercice</button></div></div>`).join('')
  +`<button style="width:100%;margin-bottom:12px" data-a=addex>Ajouter un exercice</button><div class=bar><button class=d data-a=delt>Supprimer</button><button data-a=back>Annuler</button><button class=p data-a=savet>Enregistrer</button></div>`;
}
function spark(v){if(v.length<2)return'';const mx=Math.max(...v),mn=Math.min(...v),R=mx-mn||1,W=90,H=26;
  return`<svg width=${W} height=${H} viewBox="0 0 ${W} ${H}"><polyline fill=none stroke="#64d2ff" stroke-width=2 stroke-linejoin=round points="${v.map((y,i)=>`${(i/(v.length-1)*(W-4)+2).toFixed(1)},${(H-3-(y-mn)/R*(H-6)).toFixed(1)}`).join(' ')}"/></svg>`}
function history(){
  const best={},ser={},pr={},e1={};
  S.h.forEach((h,hi)=>h.ex.forEach((e,ei)=>{const ok=e.sets.filter(s=>s.done&&+s.w>0);if(!ok.length)return;
    const m=Math.max(...ok.map(s=>+s.w));(ser[e.name]=ser[e.name]||[]).push(m);
    if(e.name in best&&m>best[e.name])pr[hi+'.'+ei]=1;
    if(!(e.name in best)||m>best[e.name])best[e.name]=m;
    e1[e.name]=Math.max(e1[e.name]||0,...ok.map(s=>s.w*(1+s.r/30)))}));
  const recs=Object.entries(best);
  return`<div class=top><h1>Historique</h1>${LOGO()}</div>`+(recs.length?`<div class=card><h2>Records de charge</h2>${recs.map(([n,w])=>`<div class=row style="justify-content:space-between"><div><div>${esc(n)}</div><div class=sub style="margin:0">1RM estimé ≈ ${Math.round(e1[n])} kg</div></div>${spark(ser[n])}<span class=big>${w} kg</span></div>`).join('')}</div>`:`<div class=empty>Termine une séance pour voir ta progression ici.</div>`)
  +S.h.map((h,hi)=>[h,hi]).reverse().map(([h,hi])=>{const vol=h.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.r||0)*(+s.w||0),0),0);
    return`<div class=card><h2>${esc(h.name)}</h2><div class=sub>${new Date(h.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}${h.dur?' · '+h.dur+' min':''} · ${Math.round(vol)} kg soulevés</div>${h.ex.map((e,ei)=>`<div style="margin:4px 0"><b>${esc(e.name)}</b>${pr[hi+'.'+ei]?' <span class=pr>record</span>':''} <span class=sub>${fmt(e)}${e.rest?' · repos '+e.rest+' s':''}</span></div>`).join('')}<button style="margin-top:8px" data-a=editlog data-i=${hi}>Modifier</button></div>`}).join('')
  +syncCard()+`<div class=bar><button data-a=export>Exporter</button><button data-a=import>Importer</button></div>`;
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='nav'){view=b.dataset.v;ed=null}
  else if(a==='new')ed={new:1,id:uid(),name:'',ex:[]};
  else if(a==='edit')ed=JSON.parse(JSON.stringify(S.t.find(t=>t.id===b.dataset.id)));
  else if(a==='addex')ed.ex.push({name:'',sets:3,min:8,max:12,w:0,inc:2.5,m:'double'});
  else if(a==='delex')ed.ex.splice(i,1);
  else if(a==='back')ed=null;
  else if(a==='delt'){if(!confirm('Supprimer cette séance ?'))return;S.t=S.t.filter(t=>t.id!==ed.id);save();ed=null}
  else if(a==='savet'){ed.ex=ed.ex.filter(x=>x.name.trim());if(!ed.name.trim()){alert('Donne un nom à la séance.');return}
    const k=S.t.findIndex(t=>t.id===ed.id);delete ed.new;k<0?S.t.push(ed):S.t[k]=ed;save();ed=null}
  else if(a==='start')start(b.dataset.id);
  else if(a==='addset'){const s=S.a.ex[i].sets,l=s[s.length-1];s.push({w:l?l.w:0,r:l?l.r:8,rpe:'',done:true});save()}
  else if(a==='editlog'){if(S.a&&!confirm('Une séance est en cours : elle sera remplacée. Continuer ?'))return;S.a=JSON.parse(JSON.stringify(S.h[i]));S.a.editIdx=i;view='home'}
  else if(a==='dellog'){if(!confirm("Supprimer cette séance de l'historique ?"))return;S.h.splice(S.a.editIdx,1);S.a=null;save();view='hist'}
  else if(a==='pushnow'){setSt('Sauvegarde…');await push()}
  else if(a==='pull')await pull();
  else if(a==='mv'){const L=ed?ed.ex:S.a.ex,j=i+(+b.dataset.d);if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];if(!ed)save()}}
  else if(a==='skip'){S.a.ex[i].skip=!S.a.ex[i].skip;save()}
  else if(a==='remset'){S.a.ex[i].sets.pop();save()}
  else if(a==='chrono'){
    if(tm&&tm.i===i){S.a.ex[i].rest=Math.round((Date.now()-tm.t)/1000);tm=null;save()}else tm={i,t:Date.now()}}
  else if(a==='cancel'){if(!confirm(S.a.editIdx!==undefined?'Annuler les modifications ?':'Abandonner cette séance ?'))return;S.a=null;tm=null;save()}
  else if(a==='finish'){
    const ex=S.a.ex.map(e=>e.skip?{...e,sets:[]}:{...e,sets:e.sets.filter(s=>+(e.t==='cardio'?s.d:s.r)>0).map(s=>({...s,done:true}))}).filter(e=>e.skip||e.sets.length);
    if(!ex.length&&!confirm('Aucune série validée. Terminer quand même ?'))return;
    const o={...S.a,ex};if(S.a.editIdx!==undefined){delete o.editIdx;S.h[S.a.editIdx]=o}else{o.dur=Math.round((Date.now()-new Date(S.a.date))/60000);S.h.push(o)}S.a=null;tm=null;save();view='hist'}
  else if(a==='export'){const j=JSON.stringify(S);

  render();
});
