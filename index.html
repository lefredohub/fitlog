<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLog">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>FitLog</title>
<style>
:root{--bg:#1b2430;--card:#243142;--line:#34455a;--tx:#eef2f6;--mut:#8fa1b5;--ac:#4da3ff;--gold:#ffb547;--ok:#3ecf8e;box-sizing:border-box}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0}
main{padding:16px 14px calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:26px;font-weight:800;margin:6px 0 14px;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 4px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>span{width:20px;color:var(--mut);font-weight:700}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 8px;font-size:17px;width:100%;min-width:0;text-align:center}
input[type=checkbox]{width:30px;height:30px;accent-color:var(--ok);flex:none}
select{text-align:left}
label{display:block;font-size:12px;color:var(--mut);margin-top:6px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{background:var(--line);color:var(--tx);border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
button.p{background:var(--ac);color:#06223f}
button.d{background:none;color:#ff7b7b}
.bar{display:flex;gap:8px;margin-top:8px}.bar button{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#141b25;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;color:var(--mut);padding:16px}
nav button.on{color:var(--ac)}
.pr{color:var(--gold);font-weight:700}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
</style></head><body><main id="app"></main>
<nav><button data-a="nav" data-v="home">Séances</button><button data-a="nav" data-v="hist">Historique</button></nav>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('fitlog'))}catch(e){}
S=S||{t:[],h:[],a:null};
const save=()=>localStorage.setItem('fitlog',JSON.stringify(S));
let view='home',ed=null,tm=null;
const METH={double:'Double progression',linear:'Surcharge linéaire',volume:'Progression en volume'};

function last(name){for(let i=S.h.length-1;i>=0;i--){const e=S.h[i].ex.find(x=>x.name===name);if(e&&e.sets.some(s=>s.done))return e}return null}

// Calcule la cible de la prochaine séance pour un exo du modèle
function target(x){
  let w=+x.w||0,r=+x.min||1,n=+x.sets||3;const l=last(x.name);
  if(!l)return{w,r,n};
  const ds=l.sets.filter(s=>s.done),lw=+ds[0].w||w,ln=l.sets.length;
  const minR=Math.min(...ds.map(s=>+s.r||0)),rpe=Math.max(...ds.map(s=>+s.rpe||0)),inc=+x.inc||0;
  w=lw;n=ln;r=+x.min;
  if(x.m==='double'){
    if(minR>=+x.max&&rpe<=9){w=lw+inc;r=+x.min;n=+x.sets}
    else r=Math.min(+x.max,Math.max(+x.min,minR+1));
  }else if(x.m==='linear'){
    if(minR>=r&&ds.length>=ln)w=lw+inc;
  }else if(minR>=r){
    if(ln<5)n=ln+1;else{w=lw+inc;n=+x.sets}
  }
  return{w,r,n};
}
function start(id){
  const t=S.t.find(t=>t.id===id);
  S.a={id:uid(),name:t.name,date:new Date().toISOString(),ex:t.ex.map(x=>{
    const g=target(x);
    return{name:x.name,m:x.m,rest:'',tg:`Cible : ${g.n}×${g.r}${x.m==='double'?'–'+x.max:''} à ${g.w} kg`,
      sets:Array.from({length:g.n},()=>({w:g.w,r:g.r,rpe:'',done:false}))}})};
  save();render();
}
function fmt(e){return e.sets.filter(s=>s.done).map(s=>`${s.w}×${s.r}`).join(', ')||'—'}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#app').innerHTML=ed?editor():view==='hist'?history():S.a?session():home();
}
function home(){
  return`<h1>Séances</h1>`+(S.t.length?S.t.map(t=>`<div class=card><h2>${esc(t.name)}</h2><div class=sub>${t.ex.map(x=>esc(x.name)).join(', ')||'Aucun exercice'}</div><div class=bar><button class=p data-a=start data-id=${t.id}>Démarrer</button><button data-a=edit data-id=${t.id}>Modifier</button></div></div>`).join(''):`<div class=empty>Aucune séance. Crée ta première séance avec ses exercices.</div>`)
  +`<button class=p style="width:100%" data-a=new>Créer une séance</button>`;
}
function session(){
  const a=S.a;
  return`<h1>${esc(a.name)}</h1>`+a.ex.map((e,i)=>`<div class=card><h2>${esc(e.name)}</h2><div class=sub>${e.tg} · ${METH[e.m]}</div>
  <div class=row><span></span><div class=sub style="flex:1;margin:0;text-align:center">kg</div><div class=sub style="flex:1;margin:0;text-align:center">reps</div><div class=sub style="flex:1;margin:0;text-align:center">RPE</div><div style="width:30px"></div></div>`
  +e.sets.map((s,j)=>`<div class=row><span>${j+1}</span><input type=number inputmode=decimal step=any data-k="${i}.${j}.w" value="${s.w}"><input type=number inputmode=numeric data-k="${i}.${j}.r" value="${s.r}"><select data-k="${i}.${j}.rpe"><option value="">–${[6,7,8,9,10].map(v=>`<option${s.rpe==v?' selected':''}>${v}`).join('')}</select><input type=checkbox data-k="${i}.${j}.done"${s.done?' checked':''}></div>`).join('')
  +`<div class=row><button data-a=addset data-i=${i}>+ Série</button><input type=number inputmode=numeric placeholder="repos (s)" data-k="${i}.rest" value="${e.rest}"><button data-a=chrono data-i=${i}>${tm&&tm.i===i?'Stop':'Chrono'}</button></div></div>`).join('')
  +`<div class=bar><button class=d data-a=cancel>Abandonner</button><button class=p data-a=finish>Terminer</button></div>`;
}
function editor(){
  return`<h1>${ed.new?'Nouvelle séance':'Modifier la séance'}</h1><div class=card><label>Nom de la séance</label><input style="text-align:left" data-e=name value="${esc(ed.name)}"></div>`
  +ed.ex.map((x,i)=>`<div class=card><label>Exercice</label><input style="text-align:left" data-e="${i}.name" value="${esc(x.name)}">
  <div class=g><div><label>Séries</label><input type=number inputmode=numeric data-e="${i}.sets" value="${x.sets}"></div><div><label>Reps min</label><input type=number inputmode=numeric data-e="${i}.min" value="${x.min}"></div><div><label>Reps max</label><input type=number inputmode=numeric data-e="${i}.max" value="${x.max}"></div><div><label>Charge (kg)</label><input type=number inputmode=decimal step=any data-e="${i}.w" value="${x.w}"></div><div><label>Pas (kg)</label><input type=number inputmode=decimal step=any data-e="${i}.inc" value="${x.inc}"></div></div>
  <label>Méthode de progression</label><select data-e="${i}.m">${Object.entries(METH).map(([k,v])=>`<option value=${k}${x.m===k?' selected':''}>${v}`).join('')}</select>
  <button class=d data-a=delex data-i=${i}>Retirer l'exercice</button></div>`).join('')
  +`<button style="width:100%;margin-bottom:12px" data-a=addex>Ajouter un exercice</button><div class=bar><button class=d data-a=delt>Supprimer</button><button data-a=back>Annuler</button><button class=p data-a=savet>Enregistrer</button></div>`;
}
function history(){
  const best={};S.h.forEach(h=>h.ex.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>{if(!best[e.name]||+s.w>best[e.name])best[e.name]=+s.w})));
  const recs=Object.entries(best);
  return`<h1>Historique</h1>`+(recs.length?`<div class=card><h2>Records de charge</h2>${recs.map(([n,w])=>`<div class=row style="justify-content:space-between"><span style="width:auto;color:var(--tx);font-weight:400">${esc(n)}</span><span class=pr style="width:auto">${w} kg</span></div>`).join('')}</div>`:`<div class=empty>Termine une séance pour voir ta progression ici.</div>`)
  +S.h.slice().reverse().map(h=>`<div class=card><h2>${esc(h.name)}</h2><div class=sub>${new Date(h.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>${h.ex.map(e=>`<div style="margin:4px 0"><b>${esc(e.name)}</b> <span class=sub>${fmt(e)}${e.rest?' · repos '+e.rest+' s':''}</span></div>`).join('')}</div>`).join('')
  +`<div class=bar><button data-a=export>Exporter</button><button data-a=import>Importer</button></div>`;
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='nav'){view=b.dataset.v;ed=null}
  else if(a==='new')ed={new:1,id:uid(),name:'',ex:[]};
  else if(a==='edit')ed=JSON.parse(JSON.stringify(S.t.find(t=>t.id===b.dataset.id)));
  else if(a==='addex')ed.ex.push({name:'',sets:3,min:8,max:12,w:0,inc:2.5,m:'double'});
  else if(a==='delex')ed.ex.splice(i,1);
  else if(a==='back')ed=null;
  else if(a==='delt'){if(!confirm('Supprimer cette séance ?'))return;S.t=S.t.filter(t=>t.id!==ed.id);save();ed=null}
  else if(a==='savet'){ed.ex=ed.ex.filter(x=>x.name.trim());if(!ed.name.trim()){alert('Donne un nom à la séance.');return}
    const k=S.t.findIndex(t=>t.id===ed.id);delete ed.new;k<0?S.t.push(ed):S.t[k]=ed;save();ed=null}
  else if(a==='start')start(b.dataset.id);
  else if(a==='addset'){const s=S.a.ex[i].sets,l=s[s.length-1];s.push({w:l?l.w:0,r:l?l.r:8,rpe:'',done:false});save()}
  else if(a==='chrono'){
    if(tm&&tm.i===i){S.a.ex[i].rest=Math.round((Date.now()-tm.t)/1000);tm=null;save()}else tm={i,t:Date.now()}}
  else if(a==='cancel'){if(!confirm('Abandonner cette séance ?'))return;S.a=null;tm=null;save()}
  else if(a==='finish'){
    const ex=S.a.ex.filter(e=>e.sets.some(s=>s.done));
    if(!ex.length&&!confirm('Aucune série validée. Terminer quand même ?'))return;
    S.h.push({...S.a,ex});S.a=null;tm=null;save();view='hist'}
  else if(a==='export'){const j=JSON.stringify(S);
    try{navigator.share?await navigator.share({text:j}):(await navigator.clipboard.writeText(j),alert('Sauvegarde copiée.'))}catch(e){}return}
  else if(a==='import'){const j=prompt('Colle ta sauvegarde');if(!j)return;try{S=JSON.parse(j);save()}catch(e){alert('Sauvegarde invalide.');return}}
  render();
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset.k,e=t.dataset.e;
  if(k){const p=k.split('.'),x=S.a.ex[p[0]];
    if(p.length===2)x[p[1]]=t.value;else x.sets[p[1]][p[2]]=t.type==='checkbox'?t.checked:t.value;save()}
  else if(e){const p=e.split('.');
    if(p.length===1)ed[p[0]]=t.value;else ed.ex[p[0]][p[1]]=t.type==='number'?+t.value:t.value}
  if(t.dataset.e&&t.tagName==='SELECT')render();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
